---
argument_specs:
  main:
    short_description: Configure native time synchronisation
    description:
      - Supports Ubuntu 24.04/26.04 and Windows.
      - Configures chrony or the Windows Time client from an explicit upstream.
    options:
      time_sync_enabled:
        description:
          - Whether this host should have managed time synchronisation.
          - Setting this to false skips the role. It does not remove chrony or
            restore pool entries an earlier run commented out.
        type: bool
        default: true
      time_sync_restore_time:
        description:
          - Enable chrony startup restoration from RTC or drift-file time.
          - Applies to Ubuntu only and can step the clock at daemon startup.
        type: bool
        default: true
      time_sync_server:
        description:
          - Explicit upstream NTP hostname or address.
          - Required when time_sync_enabled is true.
        type: str
        default: ''

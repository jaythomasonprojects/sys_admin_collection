---
- name: Validate Debian or Ubuntu platform
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution in ['Debian', 'Ubuntu']
    fail_msg: 'time_sync supports Debian and Ubuntu hosts only.'

- name: Load distribution variables
  ansible.builtin.include_vars: >-
    {{ lookup("ansible.builtin.first_found", time_sync_vars_params) }}
  vars:
    time_sync_vars_params:
      files:
        - '{{ ansible_facts.distribution }}.yml'
        - '{{ ansible_facts.os_family }}.yml'
      paths:
        - 'vars'

- name: Validate time_sync_server
  ansible.builtin.assert:
    that:
      - time_sync_server is string
      - time_sync_server | length > 0
    fail_msg: 'time_sync_server must be a non-empty string.'

- name: Install ntpsec
  ansible.builtin.package:
    name: '{{ time_sync_package }}'
    state: present
  become: true

- name: Ensure ntpsec configuration directory exists
  ansible.builtin.file:
    path: '{{ time_sync_config_dir }}'
    state: directory
    owner: 'root'
    group: 'root'
    mode: '0755'
  become: true

- name: Ensure ntpsec configuration file exists
  ansible.builtin.file:
    path: '{{ time_sync_config_file }}'
    state: touch
    owner: 'root'
    group: 'root'
    mode: '0644'
    modification_time: preserve
    access_time: preserve
  become: true

- name: Comment out unmanaged pool entries
  ansible.builtin.replace:
    path: '{{ time_sync_config_file }}'
    regexp: >-
      ^pool\s+(?!{{ time_sync_server | regex_escape }}(?:\s|$)).*$
    replace: '# \g<0>'
  become: true
  notify: Restart NTP service

- name: Configure upstream NTP server
  ansible.builtin.lineinfile:
    path: '{{ time_sync_config_file }}'
    regexp: '^pool\s+{{ time_sync_server | regex_escape }}(?:\s+.*)?$'
    line: 'pool {{ time_sync_server }}'
    state: present
  become: true
  notify: Restart NTP service

- name: Enable and start ntpsec service
  ansible.builtin.systemd_service:
    name: '{{ time_sync_service }}'
    enabled: true
    state: started
  become: true

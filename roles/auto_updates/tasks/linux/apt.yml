---
- name: Remove legacy unattended-upgrades policy
  ansible.builtin.file:
    path: '/etc/apt/apt.conf.d/52jtprojects-unattended-upgrades'
    state: absent
  become: true

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true
  become: true

- name: Configure APT periodic updates
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Configure unattended-upgrades policy
  ansible.builtin.template:
    src: '52sys-admin-auto-updates.j2'
    dest: '/etc/apt/apt.conf.d/52sys-admin-auto-updates'
    owner: root
    group: root
    mode: '0644'
  become: true

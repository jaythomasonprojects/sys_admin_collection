---
# WinRM connections are network logons. Interactive runas provides the target
# user's profile, including the Credential Manager entry used by SMB.
- name: Persist Windows SMB credential
  ansible.windows.win_credential:
    name: '{{ mount_network_share_item.server }}'
    persistence: local
    secret: '{{ mount_network_share_item.password }}'
    state: present
    type: domain_password
    username: '{{ mount_network_share_item.username }}'
  become: true
  become_flags: 'logon_type=interactive logon_flags=with_profile'
  become_method: ansible.builtin.runas
  vars:
    ansible_become_pass: '{{ mount_network_share_item.password }}'
    ansible_become_user: '{{ mount_network_share_item.username }}'
  when: mount_network_share_item.username is defined

- name: Map Windows network drive
  ansible.windows.win_mapped_drive:
    letter: '{{ mount_network_share_item.mount_point }}'
    path: >-
      \\{{ windows_share_server }}\{{ windows_share_name }}
    state: '{{ mount_network_share_item.state | default("present") }}'
  become: '{{ mount_network_share_item.username is defined }}'
  become_flags: 'logon_type=interactive logon_flags=with_profile'
  become_method: ansible.builtin.runas
  vars:
    ansible_become_pass: '{{ mount_network_share_item.password | default("") }}'
    ansible_become_user: '{{ mount_network_share_item.username | default("") }}'
    windows_share_name: '{{ mount_network_share_item.share }}'
    windows_share_server: '{{ mount_network_share_item.server }}'

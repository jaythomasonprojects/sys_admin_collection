---
- name: Install SMB/CIFS mount packages
  ansible.builtin.package:
    name: 'cifs-utils'
    state: present
  become: true

- name: Inspect the credential directory
  ansible.builtin.stat:
    path: '/etc/samba/credentials'
  become: true
  register: mount_network_share_credentials_dir

- name: Create the credential directory without changing existing metadata
  ansible.builtin.file:
    path: '/etc/samba/credentials'
    state: directory
    owner: >-
      {{ omit if mount_network_share_credentials_dir.stat.exists else 'root' }}
    group: >-
      {{ omit if mount_network_share_credentials_dir.stat.exists else 'root' }}
    mode: >-
      {{ omit if mount_network_share_credentials_dir.stat.exists else '0700' }}
  become: true

- name: Manage declared Linux shares
  ansible.builtin.include_tasks: 'shares.yml'

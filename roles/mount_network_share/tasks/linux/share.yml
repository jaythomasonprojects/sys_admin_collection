---
- name: Write the protected share credential
  ansible.builtin.copy:
    dest: '/etc/samba/credentials/{{ mount_network_share_item.name }}'
    owner: 'root'
    group: 'root'
    mode: '0600'
    content: |
      username={{ mount_network_share_item.username }}
      password={{ mount_network_share_item.password }}
  become: true
  no_log: true
  notify: Restart remote-fs.target
  when: mount_network_share_present | bool

- name: Ensure mount point exists
  ansible.builtin.file:
    path: '{{ mount_network_share_item.mount_point }}'
    state: directory
    owner: '{{ mount_network_share_item.owner | default("root") }}'
    group: '{{ mount_network_share_item.group | default("root") }}'
    mode: '{{ mount_network_share_item.mode | default("0755") }}'
  become: true
  when: mount_network_share_present | bool

- name: Manage SMB/CIFS fstab entry
  ansible.posix.mount:
    path: '{{ mount_network_share_item.mount_point }}'
    src: '{{ mount_network_share_source }}'
    fstype: 'cifs'
    opts: >-
      {{ (mount_network_share_option_list
          + ['credentials=/etc/samba/credentials/'
             ~ mount_network_share_item.name]) | join(',') }}
    state: '{{ mount_network_share_state }}'
  become: true
  notify: Restart remote-fs.target

---
- name: Assert supported platform
  ansible.builtin.assert:
    that:
      - >-
        ansible_facts.system == 'Linux'
        or ansible_facts.os_family == 'Windows'
    fail_msg: 'mount_network_share supports Linux and Windows hosts only.'

- name: Manage network shares
  when:
    - mount_network_share_enabled | bool
    - mount_network_share_shares | length > 0
  block:
    - name: Require credentials for each declared share
      ansible.builtin.assert:
        that:
          - mount_network_share_item.username | default('') | length > 0
          - mount_network_share_item.password | default('') | length > 0
        fail_msg: >-
          Define username and password as non-empty strings
          on each declared share.
      loop: '{{ mount_network_share_shares }}'
      loop_control:
        loop_var: mount_network_share_item
        label: '{{ mount_network_share_item.name }}'
      no_log: true

    - name: Require distinct Linux credential filenames
      ansible.builtin.assert:
        that:
          - >-
            mount_network_share_shares | map(attribute='name')
            | unique(case_sensitive=true) | length
            == mount_network_share_shares | length
          - >-
            mount_network_share_shares | map(attribute='name')
            | select('match', '^(?!\.{1,2}$)[^/\\\\\s]+\Z') | list | length
            == mount_network_share_shares | length
        fail_msg: >-
          Linux share names must be distinct single credential filenames
          without whitespace.
      when: ansible_facts.system == 'Linux'

    - name: Manage network shares on Linux hosts
      ansible.builtin.include_tasks: 'linux/main.yml'
      when: ansible_facts.system == 'Linux'

    - name: Manage network shares on Windows hosts
      ansible.builtin.include_tasks: 'windows/main.yml'
      when: ansible_facts.os_family == 'Windows'

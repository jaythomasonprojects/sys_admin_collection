---
- name: Assert supported Linux distribution
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution in ['Debian', 'Ubuntu']
    fail_msg: 'git supports Debian and Ubuntu hosts only.'

# Distribution data lives in vars/ so the task body stays
# distribution-agnostic. Fedora support later needs a vars file,
# not a new task file.
- name: Load distribution variables
  ansible.builtin.include_vars: >-
    {{ lookup("ansible.builtin.first_found", git_vars_params) }}
  vars:
    git_vars_params:
      files:
        - '{{ ansible_facts.distribution }}.yml'
        - '{{ ansible_facts.os_family }}.yml'
      paths:
        - 'vars'

- name: Install Git
  ansible.builtin.package:
    name: '{{ git_package }}'
    state: present
  become: true

- name: Set Git user name
  community.general.git_config:
    name: 'user.name'
    scope: 'global'
    state: present
    value: '{{ git_user_name }}'
  when: git_user_name | length > 0

- name: Set Git user email
  community.general.git_config:
    name: 'user.email'
    scope: 'global'
    state: present
    value: '{{ git_user_email }}'
  when: git_user_email | length > 0

---
argument_specs:
  main:
    short_description: Configure Windows and Ubuntu GNOME power policy
    description:
      - Configures independent AC suspend and screen timeout policies.
    options:
      power_policy_disable_ac_suspend:
        description: Whether to disable AC suspend.
        type: bool
        default: true
      power_policy_disable_hibernate:
        description: Whether to run powercfg /hibernate off.
        type: bool
        default: true
      power_policy_disable_screen_timeout:
        description: Whether to disable screen timeout.
        type: bool
        default: false
      power_policy_enabled:
        description:
          - Whether this host should have a managed power policy.
          - Setting this to false skips the role. It does not restore the
            timeouts or power plan an earlier run applied.
        type: bool
        default: true
      power_policy_plan:
        description:
          - Name of the Windows power plan to activate.
          - An empty string leaves the active plan unchanged.
        type: str
        default: 'high performance'
      power_policy_user:
        description: >-
          Existing local user whose Ubuntu GNOME settings are configured.
        type: str
        default: ''

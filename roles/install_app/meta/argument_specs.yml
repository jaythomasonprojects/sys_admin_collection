---
argument_specs:
  main:
    short_description: Install applications through supported package channels
    description:
      - Installs applications through native package, Debian installer, npm,
        Flatpak, and Chocolatey channels.
      - Application package lists are site data. Supply them from group_vars in
        the consuming playbook repository, not from this collection.
    options:
      install_app_debs:
        description: >-
          Managed-host Debian package paths or HTTP(S) URLs to install on APT
          hosts.
        type: list
        elements: str
        default: []
      install_app_enabled:
        description:
          - Whether this host should have requested applications installed.
          - Setting this to false skips the role. It does not remove
            applications installed by an earlier run.
        type: bool
        default: true
      install_app_flatpaks:
        description: Flatpak refs to install.
        type: list
        elements: str
        default: []
      install_app_manage_flatpak_remote:
        description: >-
          Whether to configure Flathub before installing Flatpak refs.
        type: bool
        default: true
      install_app_npm_packages:
        description: Bare npm package names to install globally on Linux hosts.
        type: list
        elements: str
        default: []
      install_app_packages:
        description: Native Linux or Windows Chocolatey package names.
        type: list
        elements: str
        default: []

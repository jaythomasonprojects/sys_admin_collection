---
argument_specs:
  main:
    short_description: Install applications through supported package channels
    description:
      - Supports Ubuntu 24.04/26.04 and Windows.
      - Installs applications through native package, Debian installer, npm,
        Flatpak, and Chocolatey channels.
      - Application package lists are site data. Supply them from group_vars in
        the consuming playbook repository, not from this collection.
    options:
      install_app_apt_packages:
        description: Ubuntu APT package names.
        type: list
        elements: str
        default: []
      install_app_choco_packages:
        description: Windows Chocolatey package names.
        type: list
        elements: str
        default: []
      install_app_deb_packages:
        description: >-
          HTTP(S) Debian package URLs or managed-host package paths to install
          on APT hosts.
        type: list
        elements: str
        default: []
      install_app_enabled:
        description:
          - Whether this host should have requested applications installed.
          - Setting this to false skips the role. It does not remove
            applications installed by an earlier run.
        type: bool
        default: true
      install_app_flatpaks:
        description: Flatpak refs to install.
        type: list
        elements: str
        default: []
      install_app_manage_flatpak_remote:
        description: >-
          Whether to configure Flathub before installing Flatpak refs.
        type: bool
        default: true
      install_app_npm_packages:
        description: >-
          npm package entries to install globally on Linux, passed unchanged to
          community.general.npm. Bare names and versioned entries are accepted.
        type: list
        elements: str
        default: []

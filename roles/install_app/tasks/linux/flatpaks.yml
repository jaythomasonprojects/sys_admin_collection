---
- name: Check Flatpak executable
  ansible.builtin.command:
    argv:
      - 'flatpak'
      - '--version'
  changed_when: false
  check_mode: false
  failed_when: false
  register: install_app_flatpak_version

- name: Validate Flatpak executable
  ansible.builtin.assert:
    that:
      - install_app_flatpak_version.rc == 0
    fail_msg: >-
      install_app could not run Flatpak after installing its prerequisite.

- name: Ensure Flathub is configured
  community.general.flatpak_remote:
    name: 'flathub'
    state: present
    flatpakrepo_url: 'https://dl.flathub.org/repo/flathub.flatpakrepo'
  when: install_app_manage_flatpak_remote

- name: Install Flatpaks
  community.general.flatpak:
    name: '{{ install_app_flatpaks }}'
    state: present
    remote: 'flathub'

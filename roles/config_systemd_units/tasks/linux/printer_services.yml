---
- name: Inspect printer service load states
  ansible.builtin.command:
    argv:
      - 'systemctl'
      - 'show'
      - '--property=LoadState'
      - '--value'
      - '{{ item }}'
  loop: '{{ config_systemd_units_printer_services }}'
  loop_control:
    label: '{{ item }}'
  register: config_systemd_units_printer_service_load_states
  changed_when: false
  failed_when: false
  check_mode: false
  vars:
    config_systemd_units_printer_services:
      - 'cups-browsed.service'
      - 'avahi-daemon.service'
      - 'avahi-daemon.socket'

- name: Stop and disable loaded printer services
  ansible.builtin.systemd_service:
    enabled: false
    name: '{{ item.item }}'
    state: 'stopped'
  loop: '{{ config_systemd_units_printer_service_load_states.results }}'
  loop_control:
    label: '{{ item.item }}'
  become: true
  when: item.stdout == 'loaded'

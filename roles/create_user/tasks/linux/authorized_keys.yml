---
- name: Add SSH authorised keys for Linux users
  ansible.posix.authorized_key:
    user: '{{ item.0.name }}'
    key: '{{ item.1 }}'
    state: present
  loop: >-
    {{ query(
         'ansible.builtin.subelements',
         create_user_accounts,
         'ssh_authorized_keys',
         {'skip_missing': true}
       ) }}
  loop_control:
    label: '{{ item.0.name }}'
  become: true

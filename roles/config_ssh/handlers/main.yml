---
- name: Restart SSH service
  ansible.builtin.service:
    name: '{{ config_ssh_service_name }}'
    state: restarted
  when: ansible_facts.os_family != 'Windows'

- name: Restart Windows SSH service
  ansible.windows.win_service:
    name: 'sshd'
    state: restarted
  when: ansible_facts.os_family == 'Windows'

---
- name: Install OpenSSH Server capability
  ansible.windows.win_capability:
    name: 'OpenSSH.Server'
    state: present
  become: true

- name: Create SSH server configuration directory
  ansible.windows.win_file:
    path: 'C:\ProgramData\ssh'
    state: directory

- name: Establish native Windows SSH host keys before validation
  ansible.windows.win_powershell:
    path: 'Initialize-WindowsSshHostKeys.ps1'
  when: not ansible_check_mode

- name: Validate and promote Windows SSH server configuration
  when: not ansible_check_mode
  block:
    - name: Render temporary Windows SSH server candidate
      ansible.windows.win_template:
        dest: 'C:\ProgramData\ssh\sshd_config.sys-admin-candidate'
        src: 'sshd_config_win.j2'
      changed_when: false

    - name: Validate native Windows SSH server syntax
      ansible.windows.win_command:
        argv:
          - 'C:\Windows\System32\OpenSSH\sshd.exe'
          - '-t'
          - '-f'
          - 'C:\ProgramData\ssh\sshd_config.sys-admin-candidate'
      changed_when: false

    - name: Promote validated Windows SSH server configuration
      ansible.windows.win_copy:
        dest: 'C:\ProgramData\ssh\sshd_config'
        remote_src: true
        src: 'C:\ProgramData\ssh\sshd_config.sys-admin-candidate'
      notify: Restart Windows SSH service
  always:
    - name: Remove temporary Windows SSH server candidate
      ansible.windows.win_file:
        path: 'C:\ProgramData\ssh\sshd_config.sys-admin-candidate'
        state: absent
      changed_when: false

- name: Create firewall rule for SSH port
  community.windows.win_firewall_rule:
    action: allow
    direction: in
    enabled: true
    localport: '{{ ssh_server_port }}'
    name: 'OpenSSH Server (sshd)'
    protocol: 'TCP'
    state: present

- name: Enable and start SSH service
  ansible.windows.win_service:
    name: 'sshd'
    start_mode: auto
    state: started

- name: Set PowerShell as default SSH shell
  ansible.windows.win_regedit:
    data: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
    name: 'DefaultShell'
    path: 'HKLM:\SOFTWARE\OpenSSH'
    state: present
    type: string

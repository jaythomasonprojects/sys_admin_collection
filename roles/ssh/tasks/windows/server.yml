---
- name: Validate the prepared native Windows SSH installation
  ansible.windows.win_command:
    argv:
      - 'C:\Windows\System32\OpenSSH\sshd.exe'
      - '-t'
      - '-e'
      - '-f'
      - 'C:\ProgramData\ssh\sshd_config'
  changed_when: false
  # A native SSH child must not decode its grandparent's inherited handles.
  environment:
    c28fc6f98a2c44abbbd89d6a3037d0d9_POSIX_FD_STATE: ''
  timeout: 60
  when: not ansible_check_mode

- name: Validate and promote Windows SSH server configuration
  when: not ansible_check_mode
  block:
    - name: Render temporary Windows SSH server candidate
      ansible.windows.win_template:
        dest: 'C:\ProgramData\ssh\sshd_config.sys-admin-candidate'
        src: 'sshd_config_win.j2'
      changed_when: false

    - name: Validate native Windows SSH server syntax
      # Keep diagnostics on stderr rather than the Windows event-log sink.
      ansible.windows.win_command:
        argv:
          - 'C:\Windows\System32\OpenSSH\sshd.exe'
          - '-t'
          - '-e'
          - '-f'
          - 'C:\ProgramData\ssh\sshd_config.sys-admin-candidate'
      changed_when: false
      environment:
        c28fc6f98a2c44abbbd89d6a3037d0d9_POSIX_FD_STATE: ''
      timeout: 60

    - name: Promote validated Windows SSH server configuration
      ansible.windows.win_copy:
        dest: 'C:\ProgramData\ssh\sshd_config'
        remote_src: true
        src: 'C:\ProgramData\ssh\sshd_config.sys-admin-candidate'
      notify: Restart Windows SSH service
  always:
    - name: Remove temporary Windows SSH server candidate
      ansible.windows.win_file:
        path: 'C:\ProgramData\ssh\sshd_config.sys-admin-candidate'
        state: absent
      changed_when: false

- name: Read the managed firewall ports before staging activation
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      $rule = Get-NetFirewallRule -DisplayName 'OpenSSH Server (sshd)' `
          -ErrorAction SilentlyContinue
      $Ansible.Result = @()
      if ($rule) {
          $Ansible.Result = @($rule | Get-NetFirewallPortFilter |
              Select-Object -ExpandProperty LocalPort)
      }
  register: ssh_windows_firewall_ports
  timeout: 60

# Keep the current transport open until the detached handler activates policy.
- name: Stage firewall access for validated SSH activation
  community.windows.win_firewall_rule:
    action: allow
    direction: in
    enabled: true
    localport: >-
      {{ (ssh_windows_firewall_ports.result + [ssh_server_port | string])
         | unique | join(',') }}
    name: 'OpenSSH Server (sshd)'
    protocol: 'TCP'
    state: present
  changed_when: >-
    ssh_windows_firewall_access.changed or
    ssh_windows_firewall_ports.result | sort != [ssh_server_port | string]
  notify: Restart Windows SSH service
  register: ssh_windows_firewall_access
  timeout: 60

- name: Enable and start SSH service
  ansible.windows.win_service:
    name: 'sshd'
    start_mode: auto
    state: started

---
- name: Assert supported platform
  ansible.builtin.assert:
    that:
      - >-
        (ansible_facts.distribution | default('') == 'Ubuntu'
         and ansible_facts.distribution_version | default('')
         in ['24.04', '26.04'])
        or ansible_facts.os_family | default('') == 'Windows'
    fail_msg: >-
      ssh supports Ubuntu 24.04/26.04 and Windows meeting native OpenSSH
      capability prerequisites only.

- name: Configure SSH on Linux hosts
  ansible.builtin.include_tasks: 'linux/main.yml'
  when:
    - ssh_enabled | bool
    - ansible_facts.distribution | default('') == 'Ubuntu'

- name: Configure SSH on Windows hosts
  ansible.builtin.include_tasks: 'windows/main.yml'
  when:
    - ssh_enabled | bool
    - ansible_facts.os_family == 'Windows'

---
- name: Assert supported platform
  ansible.builtin.assert:
    that:
      - >-
        ansible_facts.os_family == 'Windows'
        or ansible_facts.distribution | default('') in
        ['Debian', 'Fedora', 'Ubuntu']
    fail_msg: 'ssh supports Debian, Ubuntu, Fedora, and Windows hosts only.'

- name: Configure SSH on Linux hosts
  ansible.builtin.include_tasks: 'linux/main.yml'
  when:
    - ssh_enabled | bool
    - ansible_facts.distribution | default('') in ['Debian', 'Fedora', 'Ubuntu']

- name: Configure SSH on Windows hosts
  ansible.builtin.include_tasks: 'windows/main.yml'
  when:
    - ssh_enabled | bool
    - ansible_facts.os_family == 'Windows'

---
- name: Create SSH runtime directory
  ansible.builtin.file:
    path: '/run/sshd'
    state: directory
    mode: '0755'
  become: true

- name: Establish missing native SSH host keys
  ansible.builtin.command:
    argv:
      - 'ssh-keygen'
      - '-A'
  become: true
  changed_when: ssh_host_keys.stdout | trim | length > 0
  register: ssh_host_keys

- name: Validate and deploy complete SSH server configuration
  ansible.builtin.template:
    src: 'sshd_custom.conf.j2'
    dest: '/etc/ssh/sshd_config'
    mode: '0600'
    validate: '/usr/sbin/sshd -t -f %s'
  become: true
  notify: Restart SSH service

- name: Enable and start SSH service
  ansible.builtin.systemd_service:
    name: '{{ ssh_service_name }}'
    enabled: true
    state: started
  become: true

---
# Fedora SELinux permits sshd on port 22 by default.
# This role does not manage alternate port labels.
- name: Assert Fedora SSH port
  ansible.builtin.assert:
    that:
      - ssh_server_port == 22
    fail_msg: 'ssh_server_port must be 22 on Fedora hosts.'
  when: ansible_facts.distribution == 'Fedora'

- name: Load distribution variables
  ansible.builtin.include_vars: >-
    {{ lookup("ansible.builtin.first_found", ssh_vars_params) }}
  vars:
    ssh_vars_params:
      files:
        - '{{ ansible_facts.distribution }}.yml'
        - '{{ ansible_facts.os_family }}.yml'
      paths:
        - 'vars'

- name: Install OpenSSH packages
  ansible.builtin.package:
    name: '{{ ssh_packages }}'
    state: present
  become: true

- name: Configure SSH client
  ansible.builtin.include_tasks: 'client.yml'

- name: Configure SSH server
  ansible.builtin.include_tasks: 'server.yml'

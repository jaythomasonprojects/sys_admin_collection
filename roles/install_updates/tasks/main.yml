---
- name: Assert supported platform
  ansible.builtin.assert:
    that:
      - >-
        ansible_facts.os_family == 'Windows' or
        (ansible_facts.system == 'Linux'
         and ansible_facts.distribution | default('') == 'Ubuntu'
         and ansible_facts.distribution_version | default('')
         in ['24.04', '26.04'])
    fail_msg: >-
      install_updates supports Ubuntu 24.04/26.04 and Windows hosts only.

- name: Update installed Ubuntu package channels
  ansible.builtin.include_tasks: 'linux/main.yml'
  when: ansible_facts.system == 'Linux'

- name: Install Windows updates
  ansible.builtin.include_tasks: 'windows/main.yml'
  when: ansible_facts.os_family == 'Windows'

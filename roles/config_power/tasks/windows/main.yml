---
- name: Set power plan
  community.windows.win_power_plan:
    name: '{{ config_power_power_plan }}'
  when:
    - config_power_power_plan | length > 0

# powercfg /change sets timeouts to 0 (never). The script uses
# $Ansible.Result.changed to report idempotency: it checks current
# values first and only runs powercfg /change when a value is
# non-zero.
- name: Disable sleep and standby timeouts
  ansible.windows.win_powershell:
    script: |
      if ($null -eq $Ansible.Result) {
          $Ansible.Result = @{}
      }
      $Ansible.Result.changed = $false
      $settings = @(
          @{
            Change = 'monitor-timeout-ac'
            PowerSource = 'AC'
            Setting = 'VIDEOIDLE'
            Subgroup = 'SUB_VIDEO'
          },
          @{
            Change = 'standby-timeout-ac'
            PowerSource = 'AC'
            Setting = 'STANDBYIDLE'
            Subgroup = 'SUB_SLEEP'
          },
          @{
            Change = 'monitor-timeout-dc'
            PowerSource = 'DC'
            Setting = 'VIDEOIDLE'
            Subgroup = 'SUB_VIDEO'
          },
          @{
            Change = 'standby-timeout-dc'
            PowerSource = 'DC'
            Setting = 'STANDBYIDLE'
            Subgroup = 'SUB_SLEEP'
          }
      )
      foreach ($setting in $settings) {
          $pattern = 'Current ' + $setting.PowerSource +
              ' Power Setting Index: 0x([0-9a-f]+)'
          $matches = @(powercfg /query SCHEME_CURRENT $setting.Subgroup `
              $setting.Setting | Select-String `
              $pattern)
          if ($matches.Count -ne 1) {
              throw "Could not query $($setting.PowerSource) timeout for " +
                  "$($setting.Subgroup)/$($setting.Setting)."
          }
          $value = [Convert]::ToInt32(
              $matches[0].Matches[0].Groups[1].Value, 16)
          if ($value -ne 0) {
              powercfg /change $setting.Change 0
              $Ansible.Result.changed = $true
          }
      }
  register: config_power_sleep_result
  when:
    - config_power_disable_sleep | bool
  changed_when: >-
    config_power_sleep_result.result.changed
    | default(false)

- name: Disable hibernate
  ansible.windows.win_command: 'powercfg /hibernate off'
  when:
    - config_power_disable_hibernate | bool
  changed_when: false

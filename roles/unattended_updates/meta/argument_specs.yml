---
argument_specs:
  main:
    short_description: Configure persistent unattended-update policy
    description:
      - Supports Ubuntu 24.04/26.04 and Windows.
      - Configures persistent automatic update schedules on Linux.
      - Controls Windows rolling pause and automatic reboots independently.
    options:
      unattended_updates_apt_auto_reboot:
        description: Allow unattended-upgrades to reboot when needed.
        type: bool
        default: false
      unattended_updates_apt_auto_reboot_time:
        description: Reboot window for unattended-upgrades.
        type: str
        default: '02:00'
      unattended_updates_apt_origins:
        description: Explicit APT origins pattern override.
        type: list
        elements: str
        default: []
      unattended_updates_apt_package_blacklist:
        description: Packages to exclude from unattended upgrades.
        type: list
        elements: str
        default: []
      unattended_updates_enabled:
        description:
          - Whether this host should have automatic updates configured.
          - >-
            Setting this to false converges Linux to a disabled schedule by
            writing zeroed APT periodic counters, rather than skipping the role.
          - >-
            Windows false maintains a rolling pause; true removes owned pause
            suppression without installing updates.
        type: bool
        default: true
      unattended_updates_win_auto_reboot:
        description: Allow Windows automatic reboots without owned suppression.
        type: bool
        default: false

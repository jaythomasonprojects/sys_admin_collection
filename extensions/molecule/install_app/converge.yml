---
- name: Verify npm prerequisite ownership
  hosts: npm_missing
  become: true
  gather_facts: true
  vars:
    install_app_debs: []
    install_app_flatpaks: []
    install_app_manage_flatpak_remote: false
    install_app_npm_packages:
      - 'is-number'
    install_app_packages: []
  tasks:
    - name: Run install_app with an npm application
      ansible.builtin.include_role:
        name: 'jaythomasonprojects.sys_admin.install_app'

    - name: Gather package facts
      ansible.builtin.package_facts:

    - name: Check npm executable
      ansible.builtin.command:
        argv:
          - 'npm'
          - '--version'
      changed_when: false
      register: install_app_npm_version

    - name: Assert npm prerequisite installation
      ansible.builtin.assert:
        that:
          - >-
            'npm' in ansible_facts.packages
            or 'nodejs-npm' in ansible_facts.packages
          - install_app_npm_version.rc == 0
        fail_msg: >-
          install_app did not install its npm prerequisite before installing
          requested npm applications.

- name: Converge install_app scenario
  hosts: npm_success
  become: true
  gather_facts: true
  vars:
    install_app_flatpaks: []
    install_app_manage_flatpak_remote: false
    install_app_npm_packages:
      - 'is-number'
    install_app_packages:
      - 'jq'
  pre_tasks:
    - name: Set Debian fixture list
      ansible.builtin.set_fact:
        install_app_debs:
          - name: 'install-app-fixture'
            deb: >-
              {{ '/usr/local/src/install-app-fixture.deb'
              if ansible_facts.pkg_mgr == 'apt'
              else '/usr/local/src/unavailable-install-app-fixture.deb' }}
            creates: '/usr/local/bin/install-app-fixture'
  roles:
    - role: 'jaythomasonprojects.sys_admin.install_app'
  tasks:
    - name: Reject unsupported operating systems
      block:
        - name: Configure unsupported operating system
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.install_app'
          vars:
            ansible_facts:
              os_family: 'Darwin'
              system: 'Darwin'
            install_app_debs: []
            install_app_flatpaks: []
            install_app_npm_packages: []
            install_app_packages: []
      rescue:
        - name: Record unsupported operating system rejection
          ansible.builtin.set_fact:
            install_app_unsupported_platform_failure: >-
              {{ ansible_failed_result.msg | default('') }}

    - name: Assert unsupported operating system was rejected
      ansible.builtin.assert:
        that:
          - >-
            install_app_unsupported_platform_failure ==
            'install_app supports Linux and Windows hosts only.'

    - name: Reject invalid Debian package installer definitions
      block:
        - name: Run install_app with an invalid Debian package definition
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.install_app'
          vars:
            install_app_debs:
              - name: 'invalid-install-app-fixture'
            install_app_flatpaks:
              []
            install_app_manage_flatpak_remote: false
            install_app_npm_packages: []
            install_app_packages: []
      rescue:
        - name: Record invalid Debian package definition rejection
          ansible.builtin.set_fact:
            install_app_invalid_deb_failure: >-
              {{ ansible_failed_result.msg | default('') }}

    - name: Assert invalid Debian package definition was rejected
      ansible.builtin.assert:
        that:
          - >-
            install_app_invalid_deb_failure | default('') ==
            'Each install_app_debs item must define either src, url, or deb. '
            ~ 'Items that define src or url must also define dest. Do not '
            ~ 'define both src and url.'
      when: ansible_facts.pkg_mgr == 'apt'

    - name: Reject versioned npm package requests
      block:
        - name: Request a versioned npm package
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.install_app'
          vars:
            install_app_debs: []
            install_app_flatpaks: []
            install_app_npm_packages:
              - 'is-number@7.0.0'
            install_app_packages: []
      rescue:
        - name: Record versioned npm package rejection
          ansible.builtin.set_fact:
            install_app_versioned_npm_rejected: true

    - name: Assert versioned npm package was rejected
      ansible.builtin.assert:
        that:
          - >-
            install_app_versioned_npm_rejected | default(false)

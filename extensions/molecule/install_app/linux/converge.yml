---
- name: Verify npm prerequisite ownership
  hosts: ubuntu
  gather_facts: true
  vars:
    ansible_user: 'molecule'
    install_app_debs: []
    install_app_flatpaks: []
    install_app_manage_flatpak_remote: false
    install_app_npm_packages:
      - 'is-number'
    install_app_packages: []
  tasks:
    - name: Inspect npm caller identity
      ansible.builtin.command:
        argv:
          - 'id'
          - '-u'
      register: install_app_caller_uid
      changed_when: false

    - name: Inspect global package prefix ownership
      ansible.builtin.stat:
        path: '/usr/local'
      register: install_app_global_prefix

    - name: Assert unprivileged connection and root-owned prefix
      ansible.builtin.assert:
        that:
          - install_app_caller_uid.stdout | trim != '0'
          - install_app_global_prefix.stat.pw_name == 'root'
          - install_app_global_prefix.stat.mode == '0755'

    - name: Prove passwordless sudo is available for native packages
      ansible.builtin.command:
        argv:
          - 'sudo'
          - '-n'
          - 'true'
      changed_when: false

    - name: Run install_app with an npm application
      ansible.builtin.include_role:
        name: 'jaythomasonprojects.sys_admin.install_app'

    - name: Gather package facts
      ansible.builtin.package_facts:

    - name: Check npm executable
      ansible.builtin.command:
        argv:
          - 'npm'
          - '--version'
      changed_when: false
      register: install_app_npm_version

    - name: Assert npm prerequisite installation
      ansible.builtin.assert:
        that:
          - >-
            'npm' in ansible_facts.packages
            or 'nodejs-npm' in ansible_facts.packages
          - install_app_npm_version.rc == 0
        fail_msg: >-
          install_app did not install its npm prerequisite before installing
          requested npm applications.

    - name: Query npm fixture after prerequisite-only installation
      ansible.builtin.command:
        argv:
          - 'npm'
          - 'list'
          - '--global'
          - '--depth=0'
          - 'is-number'
      register: install_app_npm_only_fixture
      changed_when: false

    - name: Assert npm-only invocation installed the global fixture
      ansible.builtin.assert:
        that:
          - install_app_npm_only_fixture.rc == 0
          - install_app_npm_only_fixture.stdout is search('is-number@')

- name: Converge install_app scenario
  hosts: all
  gather_facts: true
  vars:
    ansible_user: 'molecule'
    install_app_flatpaks: []
    install_app_manage_flatpak_remote: false
    install_app_npm_packages:
      - 'is-number'
    install_app_packages:
      - 'jq'
  pre_tasks:
    - name: Set Debian package references
      ansible.builtin.set_fact:
        install_app_debs:
          - >-
            {{ '/usr/local/src/install-app-fixture.deb' if
            ansible_facts.pkg_mgr == 'apt' else
            '/usr/local/src/unavailable-install-app-fixture.deb' }}
          - >-
            {{ 'http://127.0.0.1:8765/install-app-url-fixture.deb' if
            ansible_facts.pkg_mgr == 'apt' else
            'http://127.0.0.1:9/unavailable.deb' }}
  tasks:
    - name: Inspect application caller identity
      ansible.builtin.command:
        argv:
          - 'id'
          - '-u'
      register: install_app_caller_uid
      changed_when: false

    - name: Assert application caller is unprivileged
      ansible.builtin.assert:
        that:
          - install_app_caller_uid.stdout | trim != '0'

    - name: Apply application policy
      ansible.builtin.include_role:
        name: 'jaythomasonprojects.sys_admin.install_app'

    - name: Apply disabled application installation
      ansible.builtin.include_role:
        name: 'jaythomasonprojects.sys_admin.install_app'
      vars:
        install_app_debs:
          - '/usr/local/src/unavailable-disabled-package.deb'
          - 'http://127.0.0.1:9/unavailable-disabled.deb'
        install_app_enabled: false
        install_app_packages:
          - 'this-package-does-not-exist'

    - name: Reject unsupported operating systems
      block:
        - name: Configure unsupported operating system
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.install_app'
          vars:
            ansible_facts:
              os_family: 'Darwin'
              system: 'Darwin'
            install_app_debs: []
            install_app_flatpaks: []
            install_app_npm_packages: []
            install_app_packages: []
      rescue:
        - name: Record unsupported operating system rejection
          ansible.builtin.set_fact:
            install_app_unsupported_platform_failure: >-
              {{ ansible_failed_result.msg | default('') }}

    - name: Assert unsupported operating system was rejected
      ansible.builtin.assert:
        that:
          - >-
            install_app_unsupported_platform_failure ==
            'install_app supports Linux and Windows hosts only.'

    - name: Reject a missing Debian package reference on APT
      when: ansible_facts.pkg_mgr == 'apt'
      block:
        - name: Run install_app with a missing Debian package path
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.install_app'
          vars:
            install_app_debs:
              - '/usr/local/src/missing-install-app-fixture.deb'
            install_app_flatpaks: []
            install_app_manage_flatpak_remote: false
            install_app_npm_packages: []
            install_app_packages: []

        - name: Fail if a missing Debian package was accepted
          ansible.builtin.fail:
            msg: 'Missing Debian reference was silently accepted.'
      rescue:
        - name: Assert APT rejected the missing package path
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_result.results | default([])
                | map(attribute='msg')
                | select('search', 'missing-install-app-fixture.deb')
                | list | length > 0

    - name: Reject versioned npm package requests
      block:
        - name: Request a versioned npm package
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.install_app'
          vars:
            install_app_debs: []
            install_app_flatpaks: []
            install_app_npm_packages:
              - 'is-number@7.0.0'
            install_app_packages: []
      rescue:
        - name: Record versioned npm package rejection
          ansible.builtin.set_fact:
            install_app_versioned_npm_rejected: true

    - name: Assert versioned npm package was rejected
      ansible.builtin.assert:
        that:
          - >-
            install_app_versioned_npm_rejected | default(false)

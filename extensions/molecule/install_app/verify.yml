---
- name: Verify install_app results
  hosts: npm_success
  become: true
  gather_facts: true
  vars:
    expected_package_name: "jq"
  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:

    - name: Assert channel prerequisites and skips
      ansible.builtin.assert:
        that:
          - "expected_package_name in ansible_facts.packages"
          - >-
            'npm' in ansible_facts.packages
            if ansible_facts['pkg_mgr'] == 'apt'
            else ansible_facts.packages.keys()
            | select('match', '^nodejs.*-npm$') | list | length > 0
          - "'flatpak' not in ansible_facts.packages"
          - >-
            ansible_facts['pkg_mgr'] == 'apt' or
            'install-app-fixture' not in ansible_facts.packages
        fail_msg: >-
          install_app did not apply native and npm channels while skipping
          unrequested Flatpak and unsupported Debian-installer channels.

    - name: Verify APT package installation
      ansible.builtin.include_tasks: "verify_apt.yml"
      when: ansible_facts["pkg_mgr"] == "apt"

    - name: Verify DNF package installation
      ansible.builtin.include_tasks: "verify_dnf.yml"
      when: ansible_facts["pkg_mgr"] in ["dnf", "dnf5"]

    - name: Query globally installed npm fixture
      ansible.builtin.command:
        argv:
          - 'npm'
          - 'list'
          - '--global'
          - '--depth=0'
          - 'is-number'
      register: install_app_npm_fixture
      changed_when: false

    - name: Assert global npm fixture installation
      ansible.builtin.assert:
        that:
          - install_app_npm_fixture.rc == 0
          - install_app_npm_fixture.stdout is search('is-number@')
        fail_msg: >-
          install_app did not install is-number globally through npm.

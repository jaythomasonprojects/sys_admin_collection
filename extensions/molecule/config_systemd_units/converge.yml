---
- name: Converge config_systemd_units scenario
  hosts: all
  gather_facts: true
  vars:
    config_systemd_units_custom_services:
      - name: 'molecule-created.service'
        enabled: true
        state: 'started'
        unit_content: |
          [Unit]
          Description=Molecule role-created fixture

          [Service]
          ExecStart=/usr/bin/sleep infinity

          [Install]
          WantedBy=multi-user.target
      - name: 'molecule-remove.service'
        unit_file_state: 'absent'
        unit_content: |
          [Service]
          ExecStart=/usr/bin/true
  roles:
    - role: 'jaythomasonprojects.sys_admin.config_systemd_units'

  tasks:
    - name: Initialise custom-service rejection results
      ansible.builtin.set_fact:
        config_systemd_units_absent_lifecycle_rejected: false
        config_systemd_units_duplicate_rejected: false
        config_systemd_units_missing_content_rejected: false
        config_systemd_units_printer_name_rejected: false
        config_systemd_units_unknown_key_rejected: false

    - name: Exercise missing unit content failure
      block:
        - name: Apply service without unit content
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.config_systemd_units'
          vars:
            config_systemd_units_custom_services:
              - name: 'molecule-missing-content.service'
      rescue:
        - name: Record missing unit content rejection
          ansible.builtin.set_fact:
            config_systemd_units_missing_content_rejected: true

    - name: Exercise unknown key failure
      block:
        - name: Apply service with masked policy
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.config_systemd_units'
          vars:
            config_systemd_units_custom_services:
              - name: 'molecule-unknown-key.service'
                masked: true
                unit_content: |
                  [Service]
                  ExecStart=/usr/bin/true
      rescue:
        - name: Record unknown key rejection
          ansible.builtin.set_fact:
            config_systemd_units_unknown_key_rejected: true

    - name: Exercise duplicate name failure
      block:
        - name: Apply services with duplicate names
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.config_systemd_units'
          vars:
            config_systemd_units_custom_services:
              - name: 'molecule-duplicate.service'
                unit_content: |
                  [Service]
                  ExecStart=/usr/bin/true
              - name: 'molecule-duplicate.service'
                unit_content: |
                  [Service]
                  ExecStart=/usr/bin/true
      rescue:
        - name: Record duplicate name rejection
          ansible.builtin.set_fact:
            config_systemd_units_duplicate_rejected: true

    - name: Exercise printer policy name failure
      block:
        - name: Apply printer-named custom service
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.config_systemd_units'
          vars:
            config_systemd_units_custom_services:
              - name: 'avahi-daemon.service'
                unit_content: |
                  [Service]
                  ExecStart=/usr/bin/true
      rescue:
        - name: Record printer policy name rejection
          ansible.builtin.set_fact:
            config_systemd_units_printer_name_rejected: true

    - name: Exercise absent lifecycle failure
      block:
        - name: Remove service with contradictory lifecycle
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.config_systemd_units'
          vars:
            config_systemd_units_custom_services:
              - name: 'molecule-absent-lifecycle.service'
                enabled: true
                unit_file_state: 'absent'
                unit_content: |
                  [Service]
                  ExecStart=/usr/bin/true
      rescue:
        - name: Record absent lifecycle rejection
          ansible.builtin.set_fact:
            config_systemd_units_absent_lifecycle_rejected: true

    - name: Assert custom-service validation rejections
      ansible.builtin.assert:
        that:
          - config_systemd_units_absent_lifecycle_rejected
          - config_systemd_units_duplicate_rejected
          - config_systemd_units_missing_content_rejected
          - config_systemd_units_printer_name_rejected
          - config_systemd_units_unknown_key_rejected

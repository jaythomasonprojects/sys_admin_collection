---
- name: Prepare config_systemd_units scenario
  hosts: all
  gather_facts: false
  vars:
    config_systemd_units_fixture_dir: '/etc/systemd/system'
    config_systemd_units_vendor_fixture_dir: '/usr/lib/systemd/system'
    config_systemd_units_fixtures:
      - name: 'cups-browsed.service'
        description: 'Molecule cups-browsed fixture'
      - name: 'avahi-daemon.service'
        description: 'Molecule avahi-daemon fixture'
      - name: 'avahi-daemon.socket'
        description: 'Molecule avahi socket fixture'
      - name: 'molecule-mask.service'
        description: 'Molecule masking fixture'
      - name: 'molecule-remove.service'
        description: 'Molecule removal fixture'
  tasks:
    - name: Seed service fixtures
      ansible.builtin.copy:
        dest: '{{ config_systemd_units_fixture_dir }}/{{ item.name }}'
        owner: 'root'
        group: 'root'
        mode: '0644'
        content: |
          [Unit]
          Description={{ item.description }}

          [Service]
          ExecStart=/usr/bin/sleep infinity

          [Install]
          WantedBy=multi-user.target
      loop: >-
        {{ config_systemd_units_fixtures
           | rejectattr('name', 'equalto', 'avahi-daemon.socket')
           | rejectattr('name', 'equalto', 'molecule-mask.service') }}

    - name: Seed masking fixture
      ansible.builtin.copy:
        dest: >-
          {{ config_systemd_units_vendor_fixture_dir }}/molecule-mask.service
        owner: 'root'
        group: 'root'
        mode: '0644'
        content: |
          [Unit]
          Description=Molecule masking fixture

          [Service]
          ExecStart=/usr/bin/sleep infinity

          [Install]
          WantedBy=multi-user.target

    - name: Seed socket fixture
      ansible.builtin.copy:
        dest: '{{ config_systemd_units_fixture_dir }}/avahi-daemon.socket'
        owner: 'root'
        group: 'root'
        mode: '0644'
        content: |
          [Unit]
          Description=Molecule avahi socket fixture

          [Socket]
          ListenStream=/run/molecule-avahi-daemon.sock

          [Install]
          WantedBy=sockets.target

    - name: Reload fixture unit files
      ansible.builtin.systemd_service:
        daemon_reload: true
      become: true

    - name: Enable and start service fixtures
      ansible.builtin.systemd_service:
        name: '{{ item }}'
        enabled: true
        state: 'started'
      loop:
        - 'cups-browsed.service'
        - 'avahi-daemon.service'
        - 'molecule-mask.service'
        - 'molecule-remove.service'
      become: true

    - name: Enable socket fixture
      ansible.builtin.systemd_service:
        name: 'avahi-daemon.socket'
        enabled: true
      become: true

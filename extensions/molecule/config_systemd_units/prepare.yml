---
- name: Prepare config_systemd_units scenario
  hosts: all
  gather_facts: true
  vars:
    config_systemd_units_fixture_dir: '/etc/systemd/system'
    config_systemd_units_active_fixtures:
      - name: 'avahi-daemon.service'
        description: 'Molecule avahi service fixture'
      - name: 'avahi-daemon.socket'
        description: 'Molecule avahi socket fixture'
      - name: 'molecule-external.service'
        description: 'Molecule external fixture'
  tasks:
    - name: Seed service fixtures
      ansible.builtin.copy:
        content: |
          [Unit]
          Description={{ item.description }}

          [Service]
          ExecStart=/usr/bin/sleep infinity

          [Install]
          WantedBy=multi-user.target
        dest: '{{ config_systemd_units_fixture_dir }}/{{ item.name }}'
        group: 'root'
        mode: '0644'
        owner: 'root'
      loop: >-
        {{ config_systemd_units_active_fixtures
           | rejectattr('name', 'equalto', 'avahi-daemon.socket') }}
      become: true

    - name: Seed socket fixture
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Molecule avahi socket fixture

          [Socket]
          ListenStream=/run/molecule-avahi-daemon.sock

          [Install]
          WantedBy=sockets.target
        dest: '{{ config_systemd_units_fixture_dir }}/avahi-daemon.socket'
        group: 'root'
        mode: '0644'
        owner: 'root'
      become: true

    - name: Reload fixture unit files
      ansible.builtin.systemd_service:
        daemon_reload: true
      become: true

    - name: Enable and start service fixtures
      ansible.builtin.systemd_service:
        enabled: true
        name: '{{ item }}'
        state: 'started'
      loop:
        - 'avahi-daemon.service'
        - 'molecule-external.service'
      become: true

    - name: Enable socket fixture
      ansible.builtin.systemd_service:
        enabled: true
        name: 'avahi-daemon.socket'
      become: true

    - name: Create role-owned removal fixture
      ansible.builtin.include_role:
        name: 'jaythomasonprojects.sys_admin.config_systemd_units'
      vars:
        config_systemd_units_custom_services:
          - name: 'molecule-remove.service'
            unit_content: |
              [Service]
              ExecStart=/usr/bin/true

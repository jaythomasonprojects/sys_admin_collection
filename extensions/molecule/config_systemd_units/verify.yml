---
- name: Verify config_systemd_units results
  hosts: all
  gather_facts: false
  tasks:
    - name: Gather active unit states  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: 'systemctl is-active {{ item }}'
      loop:
        - 'cups-browsed.service'
        - 'avahi-daemon.service'
        - 'avahi-daemon.socket'
        - 'molecule-mask.service'
        - 'molecule-created.service'
      register: config_systemd_units_active_states
      changed_when: false
      failed_when: false

    - name: Assert active unit policy
      ansible.builtin.assert:
        that:
          - config_systemd_units_active_states.results[0].stdout == 'inactive'
          - config_systemd_units_active_states.results[1].stdout == 'inactive'
          - config_systemd_units_active_states.results[2].stdout == 'inactive'
          - config_systemd_units_active_states.results[3].stdout == 'inactive'
          - config_systemd_units_active_states.results[4].stdout == 'active'

    - name: Gather enablement states  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: 'systemctl is-enabled {{ item }}'
      loop:
        - 'cups-browsed.service'
        - 'avahi-daemon.service'
        - 'avahi-daemon.socket'
        - 'molecule-mask.service'
        - 'molecule-created.service'
      register: config_systemd_units_enablement
      changed_when: false
      failed_when: false

    - name: Assert enablement policy
      ansible.builtin.assert:
        that:
          - config_systemd_units_enablement.results[0].stdout == 'disabled'
          - config_systemd_units_enablement.results[1].stdout == 'disabled'
          - config_systemd_units_enablement.results[2].stdout == 'enabled'
          - config_systemd_units_enablement.results[3].stdout == 'masked'
          - config_systemd_units_enablement.results[4].stdout == 'enabled'

    - name: Inspect managed unit files
      ansible.builtin.stat:
        path: '/etc/systemd/system/{{ item }}'
      loop:
        - 'molecule-created.service'
        - 'molecule-remove.service'
      register: config_systemd_units_files

    - name: Assert managed unit file lifecycle
      ansible.builtin.assert:
        that:
          - config_systemd_units_files.results[0].stat.exists
          - config_systemd_units_files.results[0].stat.pw_name == 'root'
          - config_systemd_units_files.results[0].stat.gr_name == 'root'
          - config_systemd_units_files.results[0].stat.mode == '0644'
          - not config_systemd_units_files.results[1].stat.exists

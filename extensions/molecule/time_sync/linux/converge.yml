---
- name: Converge time_sync scenario
  hosts: all
  become: true
  gather_facts: true
  vars:
    time_sync_server: 'ntp1.example.invalid'
  roles:
    - role: 'jaythomasonprojects.sys_admin.time_sync'

  tasks:
    - name: Reject Ubuntu 22.04 before time policy mutation
      block:
        - name: Apply time policy with unsupported Ubuntu release facts
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.time_sync'
          vars:
            ansible_facts:
              distribution: 'Ubuntu'
              distribution_version: '22.04'
              os_family: 'Debian'
              system: 'Linux'

        - name: Fail if Ubuntu 22.04 was accepted
          ansible.builtin.fail:
            msg: 'Unsupported Ubuntu release was accepted'
      rescue:
        - name: Require the release-gate diagnostic
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_result.msg ==
                'time_sync supports Ubuntu 24.04/26.04 hosts only.'

    - name: Apply disabled time synchronisation
      ansible.builtin.include_role:
        name: 'jaythomasonprojects.sys_admin.time_sync'
      vars:
        time_sync_enabled: false
        time_sync_server: ''

    - name: Exercise unsupported Linux distribution failure
      block:
        - name: Configure time synchronisation on unsupported Linux distribution
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.time_sync'
          vars:
            ansible_facts:
              distribution: 'Rocky'
              os_family: 'RedHat'
              system: 'Linux'
            time_sync_enabled: false
            time_sync_server: ''
      rescue:
        - name: Record unsupported-platform rejection message
          ansible.builtin.set_fact:
            time_sync_unsupported_platform_failure: >-
              {{ ansible_failed_result.msg | default('') }}

    - name: Assert unsupported platform is rejected
      ansible.builtin.assert:
        that:
          - >-
            time_sync_unsupported_platform_failure ==
            'time_sync supports Ubuntu 24.04/26.04 hosts only.'

---
- name: Verify time_sync results
  hosts: all
  become: true
  gather_facts: true
  vars:
    time_sync_expected_config: >-
      {{ '/etc/chrony.conf' if ansible_facts.distribution == 'Fedora'
         else '/etc/chrony/chrony.conf' }}
    time_sync_expected_service: >-
      {{ 'chronyd' if ansible_facts.distribution == 'Fedora' else 'chrony' }}
  tasks:
    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Inspect chrony service activity  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: 'systemctl is-active {{ time_sync_expected_service }}'
      register: time_sync_service_activity
      changed_when: false

    - name: Inspect chrony service enablement  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: 'systemctl is-enabled {{ time_sync_expected_service }}'
      register: time_sync_service_enablement
      changed_when: false

    - name: Gather rendered chrony configuration state
      ansible.builtin.stat:
        path: '{{ time_sync_expected_config }}'
      register: time_sync_config_state

    - name: Read rendered chrony configuration
      ansible.builtin.slurp:
        src: '{{ time_sync_expected_config }}'
      register: time_sync_config

    - name: Decode rendered chrony configuration
      ansible.builtin.set_fact:
        time_sync_config_content: '{{ time_sync_config.content | b64decode }}'

    - name: Assert chrony configuration content
      ansible.builtin.assert:
        that:
          - "'chrony' in ansible_facts.packages"
          - time_sync_service_activity.stdout == 'active'
          - time_sync_service_enablement.stdout == 'enabled'
          - time_sync_config_state.stat.exists
          - time_sync_config_state.stat.pw_name == 'root'
          - time_sync_config_state.stat.gr_name == 'root'
          - time_sync_config_state.stat.mode == '0644'
          - "'pool ntp1.example.invalid' in time_sync_config_content"
          - >-
            (
              time_sync_config_content
              | regex_findall('^(?!#)pool\\s+.*$', multiline=True)
              | length
            ) == 1
        fail_msg: >-
          time_sync did not render the expected chrony configuration.

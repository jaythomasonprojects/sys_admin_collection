---
driver:
  name: 'docker'

platforms:
  - name: 'ubuntu'
    command: '/usr/sbin/init'
    image: 'docker.io/geerlingguy/docker-ubuntu2204-ansible:latest'
    pre_build_image: true
    privileged: true
    user: 'root'
    tty: true
    env:
      container: 'docker'
    cgroupns_mode: 'host'
    volumes:
      - '/sys/fs/cgroup:/sys/fs/cgroup:rw'

provisioner:
  name: 'ansible'
  env:
    ANSIBLE_REMOTE_USER: 'root'

scenario:
  name: 'time_sync'

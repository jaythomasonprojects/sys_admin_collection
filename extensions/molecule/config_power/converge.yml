---
- name: Converge config_power scenario
  hosts: all
  gather_facts: true
  tasks:
    - name: Reject Ubuntu hosts
      block:
        - name: Configure power policy on Ubuntu
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.config_power'
      rescue:
        - name: Record Ubuntu rejection
          ansible.builtin.set_fact:
            config_power_ubuntu_error: >-
              {{ ansible_failed_result.msg | default('') }}

    - name: Assert Ubuntu is rejected
      ansible.builtin.assert:
        that:
          - >-
            config_power_ubuntu_error | default('') ==
            'config_power supports Windows hosts only.'

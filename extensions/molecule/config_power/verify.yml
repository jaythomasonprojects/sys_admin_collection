---
- name: Verify config_power skips on Linux
  hosts: all
  gather_facts: true
  tasks:
    - name: Gather installed package facts
      ansible.builtin.package_facts:

    - name: Assert no power management packages were installed
      ansible.builtin.assert:
        that:
          - "'powercfg' not in ansible_facts.packages"
        fail_msg: >-
          config_power must skip on Linux hosts. It should not
          have installed any packages.

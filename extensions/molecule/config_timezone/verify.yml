---
- name: Verify config_timezone skips on Linux
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:
      register: config_timezone_packages

    - name: Assert role did not install packages or change state
      ansible.builtin.assert:
        that:
          - "'ntpsec' not in ansible_facts['packages']"
        fail_msg: >-
          config_timezone must skip on Linux hosts. It should not
          have installed any packages.

---
- name: Converge create_user scenario
  hosts: all
  become: true
  gather_facts: true
  vars:
    create_user_test_key: >-
      ssh-ed25519
      AAAAC3NzaC1lZDI1NTE5AAAAIKsIYhl725LLJoPLD114F8CbnMD4HzyBbs6k8ZZrVSu2
      molecule@test
    create_user_accounts:
      - name: "molecule"
        comment: "Molecule managed user"
        create_home: true
        password: "!"
        shell: "/bin/bash"
        ssh_authorized_keys:
          - "{{ create_user_test_key }}"
  roles:
    - role: 'jaythomasonprojects.sys_admin.create_user'
  tasks:
    - name: Reject unsupported operating systems
      block:
        - name: Configure unsupported operating system
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.create_user'
          vars:
            ansible_facts:
              os_family: 'Darwin'
              system: 'Darwin'
            create_user_accounts: []
      rescue:
        - name: Record unsupported operating system rejection
          ansible.builtin.set_fact:
            create_user_unsupported_platform_failure: >-
              {{ ansible_failed_result.msg | default('') }}

    - name: Assert unsupported operating system was rejected
      ansible.builtin.assert:
        that:
          - >-
            create_user_unsupported_platform_failure ==
            'create_user supports Linux and Windows hosts only.'

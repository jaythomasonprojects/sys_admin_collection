---
- name: Verify blacklist_kernel_modules results
  hosts: all
  become: true
  gather_facts: false
  vars:
    blacklist_kernel_modules_policy_file: >-
      /etc/modprobe.d/blacklist-kernel-modules-usb-storage.conf
    blacklist_kernel_modules_expected_policy: |
      # Ansible managed: blacklist_kernel_modules USB mass-storage policy.
      install usb-storage /bin/false
      blacklist usb-storage
      install uas /bin/false
      blacklist uas
  tasks:
    - name: Read USB mass-storage policy on enabled host
      ansible.builtin.slurp:
        src: '{{ blacklist_kernel_modules_policy_file }}'
      register: blacklist_kernel_modules_policy
      when: inventory_hostname == 'ubuntu-enabled'

    - name: Stat USB mass-storage policy on disabled host
      ansible.builtin.stat:
        path: '{{ blacklist_kernel_modules_policy_file }}'
      register: blacklist_kernel_modules_disabled_policy
      when: inventory_hostname == 'ubuntu-disabled'

    - name: Resolve USB storage modprobe policy
      ansible.builtin.command:
        argv:
          - 'modprobe'
          - '-n'
          - '-v'
          - 'usb-storage'
      changed_when: false
      register: blacklist_kernel_modules_modprobe
      when: inventory_hostname == 'ubuntu-enabled'

    - name: Assert USB mass-storage policy state
      ansible.builtin.assert:
        that:
          - >-
            (blacklist_kernel_modules_policy.content | b64decode) ==
            blacklist_kernel_modules_expected_policy
          - "'/bin/false' in blacklist_kernel_modules_modprobe.stdout"
        fail_msg: >-
          The enabled host does not enforce the expected USB mass-storage
          policy.
      when: inventory_hostname == 'ubuntu-enabled'

    - name: Assert obsolete USB mass-storage policy is removed
      ansible.builtin.assert:
        that:
          - not blacklist_kernel_modules_disabled_policy.stat.exists
        fail_msg: >-
          The disabled host retained the managed USB mass-storage policy.
      when: inventory_hostname == 'ubuntu-disabled'

    - name: Reject Darwin hosts
      block:
        - name: Run blacklist_kernel_modules with Darwin facts
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.blacklist_kernel_modules'
          vars:
            ansible_facts:
              os_family: 'Darwin'
              system: 'Darwin'
      rescue:
        - name: Record Darwin rejection
          ansible.builtin.set_fact:
            blacklist_kernel_modules_darwin_error: >-
              {{ ansible_failed_result.msg }}
            blacklist_kernel_modules_darwin_rejected: true

    - name: Assert Darwin is rejected
      ansible.builtin.assert:
        that:
          - blacklist_kernel_modules_darwin_rejected | default(false)
          - >-
            blacklist_kernel_modules_darwin_error ==
            'blacklist_kernel_modules supports Linux hosts only.'
        fail_msg: 'blacklist_kernel_modules accepted a Darwin host.'

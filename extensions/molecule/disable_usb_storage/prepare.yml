---
- name: Prepare disable_usb_storage scenario
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Install modprobe utility
      ansible.builtin.apt:
        name: 'kmod'
        state: 'present'
        update_cache: true

    - name: Read shared kernel modules before convergence
      ansible.builtin.command:
        argv:
          - 'cat'
          - '/proc/modules'
      changed_when: false
      register: disable_usb_storage_loaded_modules

    - name: Assert USB mass-storage modules are not loaded
      ansible.builtin.assert:
        that:
          - >-
            disable_usb_storage_loaded_modules.stdout_lines |
            select('match', '^usb_storage\\s') | list | length == 0
          - >-
            disable_usb_storage_loaded_modules.stdout_lines |
            select('match', '^uas\\s') | list | length == 0
        fail_msg: >-
          The Docker host has USB mass-storage modules loaded, so this scenario
          cannot safely validate mandatory runtime unloading.

    - name: Create modprobe configuration directory on disabled host
      ansible.builtin.file:
        group: 'root'
        mode: '0755'
        owner: 'root'
        path: '/etc/modprobe.d'
        state: 'directory'
      when: inventory_hostname == 'ubuntu-disabled'

    - name: Seed obsolete USB mass-storage policy on disabled host
      ansible.builtin.copy:
        content: 'obsolete policy\n'
        dest: '/etc/modprobe.d/disable-usb-storage.conf'
        group: 'root'
        mode: '0644'
        owner: 'root'
      when: inventory_hostname == 'ubuntu-disabled'

---
- name: Verify disable_usb_storage results
  hosts: all
  become: true
  gather_facts: false
  vars:
    disable_usb_storage_policy_file: >-
      /etc/modprobe.d/disable-usb-storage.conf
    disable_usb_storage_expected_policy: |
      # Ansible managed: disable_usb_storage USB mass-storage policy.
      install usb-storage /bin/false
      blacklist usb-storage
      install uas /bin/false
      blacklist uas
  tasks:
    - name: Read USB mass-storage policy on enabled host
      ansible.builtin.slurp:
        src: '{{ disable_usb_storage_policy_file }}'
      register: disable_usb_storage_policy
      when: inventory_hostname in groups['enabled']

    - name: Stat USB mass-storage policy on disabled host
      ansible.builtin.stat:
        path: '{{ disable_usb_storage_policy_file }}'
      register: disable_usb_storage_disabled_policy
      when: inventory_hostname in groups['disabled']

    - name: Resolve USB storage modprobe policy
      ansible.builtin.command:
        argv:
          - 'modprobe'
          - '-n'
          - '-v'
          - 'usb-storage'
      changed_when: false
      register: disable_usb_storage_modprobe
      when: inventory_hostname in groups['enabled']

    - name: Assert USB mass-storage policy state
      ansible.builtin.assert:
        that:
          - >-
            (disable_usb_storage_policy.content | b64decode) ==
            disable_usb_storage_expected_policy
          - "'/bin/false' in disable_usb_storage_modprobe.stdout"
        fail_msg: >-
          The enabled host does not enforce the expected USB mass-storage
          policy.
      when: inventory_hostname in groups['enabled']

    - name: Assert obsolete USB mass-storage policy is removed
      ansible.builtin.assert:
        that:
          - not disable_usb_storage_disabled_policy.stat.exists
        fail_msg: >-
          The disabled host retained the managed USB mass-storage policy.
      when: inventory_hostname in groups['disabled']

    - name: Reject Darwin hosts
      block:
        - name: Run disable_usb_storage with Darwin facts
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.disable_usb_storage'
          vars:
            ansible_facts:
              os_family: 'Darwin'
              system: 'Darwin'
      rescue:
        - name: Record Darwin rejection
          ansible.builtin.set_fact:
            disable_usb_storage_darwin_error: >-
              {{ ansible_failed_result.msg }}
            disable_usb_storage_darwin_rejected: true

    - name: Assert Darwin is rejected
      ansible.builtin.assert:
        that:
          - disable_usb_storage_darwin_rejected | default(false)
          - >-
            disable_usb_storage_darwin_error ==
            'disable_usb_storage supports Linux hosts only.'
        fail_msg: 'disable_usb_storage accepted a Darwin host.'

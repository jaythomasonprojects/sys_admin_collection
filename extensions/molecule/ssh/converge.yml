---
- name: Converge SSH scenario
  hosts: all
  become: true
  gather_facts: true
  vars:
    ssh_server_permit_root_login: 'prohibit-password'
    ssh_server_allow_users:
      - 'molecule'
    ssh_client_strict_host_key_checking: 'no'
    ssh_client_forward_agent: 'yes'
    ssh_client_host_overrides:
      - host: 'github.com'
        settings:
          User: 'git'
  roles:
    - role: 'jaythomasonprojects.sys_admin.ssh'
  tasks:
    - name: Reject unsupported operating systems
      block:
        - name: Configure unsupported operating system
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.ssh'
          vars:
            ansible_facts:
              os_family: 'Darwin'
              system: 'Darwin'
      rescue:
        - name: Record unsupported operating system rejection
          ansible.builtin.set_fact:
            ssh_unsupported_platform_failure: >-
              {{ ansible_failed_result.msg | default('') }}

    - name: Assert unsupported operating system was rejected
      ansible.builtin.assert:
        that:
          - >-
            ssh_unsupported_platform_failure ==
            'ssh supports Debian, Ubuntu, Fedora, and Windows hosts only.'

    - name: Reject custom SSH ports on Fedora
      when: ansible_facts.distribution == 'Fedora'
      block:
        - name: Configure Fedora with a custom SSH port
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.ssh'
          vars:
            ssh_server_port: 2222
      rescue:
        - name: Record Fedora custom-port rejection
          ansible.builtin.set_fact:
            ssh_fedora_custom_port_failure: >-
              {{ ansible_failed_result.msg | default('') }}

    - name: Assert Fedora custom SSH port was rejected
      ansible.builtin.assert:
        that:
          - >-
            ssh_fedora_custom_port_failure ==
            'ssh_server_port must be 22 on Fedora hosts.'
      when: ansible_facts.distribution == 'Fedora'

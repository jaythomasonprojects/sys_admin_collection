---
- name: Exercise SSH policy from an unprivileged connection
  hosts: all
  gather_facts: true
  vars:
    ansible_user: 'molecule'
    ssh_authorized_keys:
      - keys:
          - '{{ ssh_fixture_public.content | b64decode | trim }}'
          - >-
            ssh-ed25519
            AAAAC3NzaC1lZDI1NTE5AAAAIKsIYhl725LLJoPLD114F8CbnMD4HzyBbs6k8ZZrVSu3
            molecule-second@test
        name: 'molecule'
  pre_tasks:
    - name: Read the disposable public key
      ansible.builtin.slurp:
        src: '/var/tmp/ssh-fixture-key.pub'
      register: ssh_fixture_public
  tasks:
    - name: Reject Ubuntu 22.04 before policy mutation
      block:
        - name: Apply SSH policy with unsupported Ubuntu release facts
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.ssh'
          vars:
            ansible_facts:
              distribution: 'Ubuntu'
              distribution_version: '22.04'
              os_family: 'Debian'
              system: 'Linux'

        - name: Fail if Ubuntu 22.04 was accepted
          ansible.builtin.fail:
            msg: 'Unsupported Ubuntu release was accepted'
      rescue:
        - name: Require the release-gate diagnostic
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_result.msg ==
                'ssh supports Ubuntu 24.04/26.04 and Windows meeting '
                ~ 'native OpenSSH capability prerequisites only.'

    # A real SSH caller proves escalation without a root transport.
    - name: Inspect effective connection identity
      ansible.builtin.command:
        argv:
          - 'id'
          - '-u'
      changed_when: false
      register: ssh_caller_uid

    - name: Prove caller is not root
      ansible.builtin.assert:
        that:
          - ssh_caller_uid.stdout | trim != '0'

    - name: Prove passwordless sudo is available
      ansible.builtin.command:
        argv:
          - 'sudo'
          - '-n'
          - 'true'
      changed_when: false

    - name: Apply SSH policy without play-wide escalation
      ansible.builtin.include_role:
        name: 'jaythomasonprojects.sys_admin.ssh'

    - name: Flush SSH policy handlers
      ansible.builtin.meta: flush_handlers

    - name: Close the original SSH control connection after activation
      ansible.builtin.meta: reset_connection

    - name: Require a fresh controller connection to the active SSH policy
      ansible.builtin.wait_for_connection:
        timeout: 120

    # Exercise the platform gate without provisioning an unsupported OS.
    - name: Reject unsupported operating systems
      block:
        - name: Configure unsupported operating system
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.ssh'
          vars:
            ansible_facts:
              os_family: 'Darwin'
              system: 'Darwin'
      rescue:
        - name: Record unsupported operating system rejection
          ansible.builtin.set_fact:
            ssh_unsupported_platform_failure: >-
              {{ ansible_failed_result.msg | default('') }}

    - name: Assert unsupported operating system was rejected
      ansible.builtin.assert:
        that:
          - >-
            ssh_unsupported_platform_failure ==
            'ssh supports Ubuntu 24.04/26.04 and Windows meeting native '
            ~ 'OpenSSH capability prerequisites only.'

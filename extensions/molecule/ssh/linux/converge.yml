---
- name: Exercise SSH policy from an unprivileged connection
  hosts: all
  gather_facts: true
  vars:
    ansible_user: 'molecule'
  tasks:
    # Docker defaults to root. Prove the role uses task-level escalation.
    - name: Inspect effective connection identity
      ansible.builtin.command:
        argv:
          - 'id'
          - '-u'
      changed_when: false
      register: ssh_caller_uid

    - name: Prove caller is not root
      ansible.builtin.assert:
        that:
          - ssh_caller_uid.stdout | trim != '0'

    - name: Prove passwordless sudo is available
      ansible.builtin.command:
        argv:
          - 'sudo'
          - '-n'
          - 'true'
      changed_when: false

    - name: Apply SSH policy without play-wide escalation
      ansible.builtin.include_role:
        name: 'jaythomasonprojects.sys_admin.ssh'

    - name: Flush SSH policy handlers
      ansible.builtin.meta: flush_handlers

    # Exercise the platform gate without provisioning an unsupported OS.
    - name: Reject unsupported operating systems
      block:
        - name: Configure unsupported operating system
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.ssh'
          vars:
            ansible_facts:
              os_family: 'Darwin'
              system: 'Darwin'
      rescue:
        - name: Record unsupported operating system rejection
          ansible.builtin.set_fact:
            ssh_unsupported_platform_failure: >-
              {{ ansible_failed_result.msg | default('') }}

    - name: Assert unsupported operating system was rejected
      ansible.builtin.assert:
        that:
          - >-
            ssh_unsupported_platform_failure ==
            'ssh supports Debian, Ubuntu, Fedora, and Windows meeting native '
            ~ 'OpenSSH capability prerequisites only.'

    # Alternate ports need SELinux policy that this role does not own.
    - name: Reject custom SSH ports on Fedora
      when: ansible_facts.distribution == 'Fedora'
      block:
        - name: Configure Fedora with a custom SSH port
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.ssh'
          vars:
            ssh_server_port: 2222
      rescue:
        - name: Record Fedora custom-port rejection
          ansible.builtin.set_fact:
            ssh_fedora_custom_port_failure: >-
              {{ ansible_failed_result.msg | default('') }}

    - name: Assert Fedora custom SSH port was rejected
      ansible.builtin.assert:
        that:
          - >-
            ssh_fedora_custom_port_failure ==
            'ssh_server_port must be 22 on Fedora hosts.'
      when: ansible_facts.distribution == 'Fedora'

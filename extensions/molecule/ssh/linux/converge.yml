---
- name: Exercise SSH policy from an unprivileged connection
  hosts: all
  gather_facts: true
  vars:
    ansible_user: 'molecule'
    ssh_client_forward_agent: 'no'
    ssh_client_host_overrides:
      - host: 'github.com'
        settings:
          ConnectTimeout: '1m'
          ForwardAgent: 'yes'
          Port: 2222
          User: 'git'
      - host: 'special.example.invalid'
        settings:
          Port: 2223
      - host: '*.example.invalid'
        settings:
          Port: 2201
    ssh_client_strict_host_key_checking: 'no'
    ssh_server_allow_users:
      - 'molecule'
    ssh_server_password_authentication: 'no'
    ssh_server_permit_root_login: 'prohibit-password'
  tasks:
    - name: Inspect effective connection identity
      ansible.builtin.command:
        argv:
          - 'id'
          - '-u'
      register: ssh_caller_uid
      changed_when: false

    - name: Prove caller is not root
      ansible.builtin.assert:
        that:
          - ssh_caller_uid.stdout | trim != '0'

    - name: Prove passwordless sudo is available
      ansible.builtin.command:
        argv:
          - 'sudo'
          - '-n'
          - 'true'
      changed_when: false

    - name: Apply SSH policy without play-wide escalation
      ansible.builtin.include_role:
        name: 'jaythomasonprojects.sys_admin.ssh'

    - name: Flush SSH policy handlers
      ansible.builtin.meta: flush_handlers

    - name: Inspect running SSH service
      ansible.builtin.command:
        argv:
          - 'systemctl'
          - 'is-active'
          - 'sshd'
      register: ssh_running_fedora
      changed_when: false
      when: ansible_facts.distribution == 'Fedora'

    - name: Inspect running SSH service on Debian family
      ansible.builtin.command:
        argv:
          - 'systemctl'
          - 'is-active'
          - 'ssh'
      register: ssh_running_debian
      changed_when: false
      when: ansible_facts.distribution in ['Debian', 'Ubuntu']

    - name: Assert SSH service is active
      ansible.builtin.assert:
        that:
          - >-
            (ssh_running_fedora.stdout | default('') if
            ansible_facts.distribution == 'Fedora' else
            ssh_running_debian.stdout | default('')) | trim == 'active'
    - name: Reject unsupported operating systems
      block:
        - name: Configure unsupported operating system
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.ssh'
          vars:
            ansible_facts:
              os_family: 'Darwin'
              system: 'Darwin'
      rescue:
        - name: Record unsupported operating system rejection
          ansible.builtin.set_fact:
            ssh_unsupported_platform_failure: >-
              {{ ansible_failed_result.msg | default('') }}

    - name: Assert unsupported operating system was rejected
      ansible.builtin.assert:
        that:
          - >-
            ssh_unsupported_platform_failure ==
            'ssh supports Debian, Ubuntu, Fedora, and Windows meeting native '
            ~ 'OpenSSH capability prerequisites only.'

    - name: Reject custom SSH ports on Fedora
      when: ansible_facts.distribution == 'Fedora'
      block:
        - name: Configure Fedora with a custom SSH port
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.ssh'
          vars:
            ssh_server_port: 2222
      rescue:
        - name: Record Fedora custom-port rejection
          ansible.builtin.set_fact:
            ssh_fedora_custom_port_failure: >-
              {{ ansible_failed_result.msg | default('') }}

    - name: Assert Fedora custom SSH port was rejected
      ansible.builtin.assert:
        that:
          - >-
            ssh_fedora_custom_port_failure ==
            'ssh_server_port must be 22 on Fedora hosts.'
      when: ansible_facts.distribution == 'Fedora'

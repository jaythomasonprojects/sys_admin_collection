---
- name: Verify Linux SSH policy and safe role transitions
  hosts: all
  become: true
  gather_facts: true
  vars:
    ssh_test_service: >-
      {{ 'sshd' if ansible_facts.distribution == 'Fedora' else 'ssh' }}
  tasks:
    - name: Read original managed policy
      ansible.builtin.slurp:
        src: '/etc/ssh/sshd_config.d/99-sys-admin-sshd.conf'
      register: ssh_original_managed

    - name: Record owned files before transition tests
      ansible.builtin.stat:
        path: '{{ item }}'
        checksum_algorithm: 'sha256'
      loop:
        - '/etc/ssh/sshd_config.d/99-sys-admin-sshd.conf'
        - '/etc/ssh/ssh_config.d/00-sys-admin-ssh.conf'
      register: ssh_owned_before

    # Effective output cannot show ownership or redundant baseline settings.
    - name: Assert the managed fragment contains only server policy
      ansible.builtin.assert:
        that:
          - ssh_owned_before.results[0].stat.uid == 0
          - ssh_owned_before.results[0].stat.gid == 0
          - ssh_owned_before.results[0].stat.mode == '0640'
          - >-
            (ssh_original_managed.content | b64decode) is not
            search('(?m)^(Include|Subsystem|UsePAM|KbdInteractiveAuthentication|'
              ~ 'PrintMotd) ')

    # Equal crypto values do not prove that Fedora's vendor include was read.
    - name: Query effective server policy and native include trace
      ansible.builtin.command:
        argv:
          - 'sshd'
          - '-T'
          - '-ddd'
          - '-C'
          - 'user=molecule,host=localhost,addr=127.0.0.1'
      changed_when: false
      register: ssh_effective_server

    - name: Assert effective authentication and session policy
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in ssh_effective_server.stdout_lines"
          - >-
            ('permitrootlogin without-password'
             if ansible_facts.distribution in ['Debian', 'Ubuntu']
             else 'permitrootlogin prohibit-password')
            in ssh_effective_server.stdout_lines
          - "'allowusers molecule' in ssh_effective_server.stdout_lines"
          - "'maxauthtries 3' in ssh_effective_server.stdout_lines"
          - "'clientaliveinterval 30' in ssh_effective_server.stdout_lines"
          - "'clientalivecountmax 2' in ssh_effective_server.stdout_lines"
          - "'permitemptypasswords no' in ssh_effective_server.stdout_lines"
          - "'pubkeyauthentication yes' in ssh_effective_server.stdout_lines"

    - name: Verify Fedora retains the packaged crypto policy
      when: ansible_facts.distribution == 'Fedora'
      block:
        - name: Read packaged crypto baseline
          ansible.builtin.slurp:
            src: '/var/tmp/ssh-crypto-baseline'
          register: ssh_crypto_baseline

        - name: Assert native vendor and crypto includes are active
          ansible.builtin.assert:
            that:
              - >-
                ssh_effective_server.stderr is
                search('including /etc/ssh/sshd_config.d/50-redhat.conf')
              - >-
                ssh_effective_server.stderr is search('including '
                  ~ '/etc/crypto-policies/back-ends/opensshserver.config')

        - name: Assert effective crypto settings match the packaged baseline
          ansible.builtin.assert:
            that:
              - >-
                ssh_effective_server.stdout_lines |
                select('match', item ~ ' ') | list ==
                (ssh_crypto_baseline.content | b64decode).splitlines() |
                select('match', item ~ ' ') | list
          loop:
            - 'ciphers'
            - 'macs'
            - 'kexalgorithms'
            - 'hostkeyalgorithms'
            - 'pubkeyacceptedalgorithms'

    # The client fragment alone does not prove system includes or Host ordering.
    - name: Query effective system client policy
      ansible.builtin.command:
        argv: ['ssh', '-G', '-F', '/etc/ssh/ssh_config', '{{ item }}']
      loop:
        - 'github.com'
        - 'other.invalid'
        - 'special.example.invalid'
        - 'generic.example.invalid'
      changed_when: false
      register: ssh_effective_client

    - name: Assert client overrides and defaults take effect
      ansible.builtin.assert:
        that:
          - "'port 2222' in ssh_effective_client.results[0].stdout_lines"
          - "'user git' in ssh_effective_client.results[0].stdout_lines"
          - "'forwardagent yes' in ssh_effective_client.results[0].stdout_lines"
          - >-
            'connecttimeout 60' in ssh_effective_client.results[0].stdout_lines
          - "'port 22' in ssh_effective_client.results[1].stdout_lines"
          - "'forwardagent no' in ssh_effective_client.results[1].stdout_lines"
          - >-
            'stricthostkeychecking false' in
            ssh_effective_client.results[1].stdout_lines
          - "'port 2223' in ssh_effective_client.results[2].stdout_lines"
          - "'port 2201' in ssh_effective_client.results[3].stdout_lines"

    # No rejection may restart SSH. One PID spans all three cases and cleanup.
    - name: Inspect service before rejected policy attempts
      ansible.builtin.command:
        argv: ['systemctl', 'show', '--property=MainPID', '--value',
               '{{ ssh_test_service }}']
      changed_when: false
      register: ssh_rejection_pid_before

    # Non-default metadata detects rollback that restores only the contents.
    - name: Reject invalid updates and first writes with managed-file recovery
      block:
        - name: Seed distinct prior managed metadata
          ansible.builtin.file:
            path: '/etc/ssh/sshd_config.d/99-sys-admin-sshd.conf'
            owner: 'molecule'
            group: 'molecule'
            mode: '0600'
            state: file

        - name: Inspect prior managed policy and metadata
          ansible.builtin.stat:
            path: '/etc/ssh/sshd_config.d/99-sys-admin-sshd.conf'
            checksum_algorithm: 'sha256'
          register: ssh_managed_before

        - name: Require native invalid-update rejection
          block:
            - name: Apply an invalid update to existing managed policy
              ansible.builtin.include_role:
                name: 'jaythomasonprojects.sys_admin.ssh'
              vars:
                ssh_server_login_grace_time: 'invalid'

            - name: Fail if the invalid update was accepted
              ansible.builtin.fail:
                msg: 'Invalid managed update was accepted'
          rescue:
            - name: Assert the native invalid-update diagnostic
              ansible.builtin.assert:
                that:
                  - ansible_failed_result.msg is search('invalid time value')

        - name: Inspect managed policy after the rejected update
          ansible.builtin.stat:
            path: '/etc/ssh/sshd_config.d/99-sys-admin-sshd.conf'
            checksum_algorithm: 'sha256'
          register: ssh_managed_after

        - name: Assert rollback restored contents and metadata
          ansible.builtin.assert:
            that:
              - >-
                ssh_managed_after.stat.checksum ==
                ssh_managed_before.stat.checksum
              - ssh_managed_after.stat.uid == ssh_managed_before.stat.uid
              - ssh_managed_after.stat.gid == ssh_managed_before.stat.gid
              - ssh_managed_after.stat.mode == ssh_managed_before.stat.mode

        # A first-write failure must remove the file, not restore a backup.
        - name: Remove the disposable managed policy fixture
          ansible.builtin.file:
            path: '/etc/ssh/sshd_config.d/99-sys-admin-sshd.conf'
            state: absent

        - name: Require native first-write rejection
          block:
            - name: Apply invalid policy with no existing managed file
              ansible.builtin.include_role:
                name: 'jaythomasonprojects.sys_admin.ssh'
              vars:
                ssh_server_login_grace_time: 'invalid'

            - name: Fail if the invalid first write was accepted
              ansible.builtin.fail:
                msg: 'Invalid first managed write was accepted'
          rescue:
            - name: Assert the native first-write diagnostic
              ansible.builtin.assert:
                that:
                  - ansible_failed_result.msg is search('invalid time value')

        - name: Inspect the managed path after first-write rejection
          ansible.builtin.stat:
            path: '/etc/ssh/sshd_config.d/99-sys-admin-sshd.conf'
          register: ssh_first_write_after

        - name: Assert the rejected first write left no managed file
          ansible.builtin.assert:
            that:
              - not ssh_first_write_after.stat.exists
      always:
        - name: Restore the original managed policy
          ansible.builtin.copy:
            content: '{{ ssh_original_managed.content | b64decode }}'
            dest: '/etc/ssh/sshd_config.d/99-sys-admin-sshd.conf'
            owner: 'root'
            group: 'root'
            mode: '0640'

    # Fragment-only validation misses errors in a different active include.
    - name: Reject invalid foreign policy without editing it
      block:
        - name: Seed an invalid unrelated include
          ansible.builtin.copy:
            content: "InvalidForeignDirective yes\n"
            dest: '/etc/ssh/sshd_config.d/10-molecule-invalid.conf'
            mode: '0644'
          register: ssh_foreign_fixture

        - name: Require native foreign-include rejection
          block:
            - name: Apply policy with an invalid foreign include
              ansible.builtin.include_role:
                name: 'jaythomasonprojects.sys_admin.ssh'

            - name: Fail if the invalid foreign include was accepted
              ansible.builtin.fail:
                msg: 'Invalid foreign include was accepted'
          rescue:
            - name: Assert the native foreign-include diagnostic
              ansible.builtin.assert:
                that:
                  - >-
                    ansible_failed_result.stderr is
                    search('InvalidForeignDirective')

        - name: Inspect foreign policy after rejection
          ansible.builtin.stat:
            path: '/etc/ssh/sshd_config.d/10-molecule-invalid.conf'
          register: ssh_foreign_after

        - name: Assert invalid foreign contents and metadata were preserved
          ansible.builtin.assert:
            that:
              - ssh_foreign_after.stat.checksum == ssh_foreign_fixture.checksum
              - ssh_foreign_after.stat.uid == ssh_foreign_fixture.uid
              - ssh_foreign_after.stat.gid == ssh_foreign_fixture.gid
              - ssh_foreign_after.stat.mode == ssh_foreign_fixture.mode
      always:
        - name: Remove only the invalid foreign fixture
          ansible.builtin.file:
            path: '/etc/ssh/sshd_config.d/10-molecule-invalid.conf'
            state: absent

    # A rescued failure does not prove no restart was queued. Flush it first.
    - name: Flush any incorrectly queued rejection restart
      ansible.builtin.meta: flush_handlers

    - name: Inspect service after all rejected policy attempts
      ansible.builtin.command:
        argv: ['systemctl', 'show', '--property=MainPID', '--value',
               '{{ ssh_test_service }}']
      changed_when: false
      register: ssh_rejection_pid_after

    - name: Inspect managed policy after foreign rejection
      ansible.builtin.stat:
        path: '/etc/ssh/sshd_config.d/99-sys-admin-sshd.conf'
        checksum_algorithm: 'sha256'
      register: ssh_foreign_managed_after

    - name: Find leaked managed backups after rejection tests
      ansible.builtin.find:
        paths: '/etc/ssh/sshd_config.d'
        patterns: '99-sys-admin-sshd.conf.*'
      register: ssh_rejection_backups

    - name: Assert rejections preserved working state without backups
      ansible.builtin.assert:
        that:
          - ssh_rejection_pid_before.stdout | int > 0
          - ssh_rejection_pid_before.stdout == ssh_rejection_pid_after.stdout
          - ssh_rejection_backups.matched == 0
          - >-
            ssh_foreign_managed_after.stat.checksum ==
            ssh_owned_before.results[0].stat.checksum
          - ssh_foreign_managed_after.stat.uid == 0
          - ssh_foreign_managed_after.stat.gid == 0
          - ssh_foreign_managed_after.stat.mode == '0640'

    # Molecule checks reported changes. The PID detects an unreported restart.
    - name: Activate a valid policy change once and restore the original policy
      block:
        - name: Apply valid changed server policy
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.ssh'
          vars:
            ssh_server_password_authentication: 'yes'

        - name: Flush changed policy handlers
          ansible.builtin.meta: flush_handlers

        - name: Inspect activated server policy
          ansible.builtin.command:
            argv: ['sshd', '-T']
          changed_when: false
          register: ssh_transition_effective

        - name: Inspect restarted SSH service process
          ansible.builtin.command:
            argv: ['systemctl', 'show', '--property=MainPID', '--value',
                   '{{ ssh_test_service }}']
          changed_when: false
          register: ssh_transition_pid

        - name: Assert the new policy took effect and restarted SSH
          ansible.builtin.assert:
            that:
              - >-
                'passwordauthentication yes' in
                ssh_transition_effective.stdout_lines
              - ssh_transition_pid.stdout | int > 0
              - ssh_transition_pid.stdout != ssh_rejection_pid_after.stdout

        - name: Reapply unchanged policy
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.ssh'
          vars:
            ssh_server_password_authentication: 'yes'

        - name: Flush unchanged policy handlers
          ansible.builtin.meta: flush_handlers

        - name: Inspect service process after the unchanged pass
          ansible.builtin.command:
            argv: ['systemctl', 'show', '--property=MainPID', '--value',
                   '{{ ssh_test_service }}']
          changed_when: false
          register: ssh_repeat_pid

        - name: Assert the repeat did not restart SSH
          ansible.builtin.assert:
            that:
              - ssh_repeat_pid.stdout == ssh_transition_pid.stdout
      always:
        - name: Restore original server policy
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.ssh'

        - name: Flush restored policy handlers
          ansible.builtin.meta: flush_handlers

    # The 99- filename does not override earlier first-value settings.
    - name: Preserve earlier foreign policy and native precedence
      block:
        - name: Seed earlier authentication policy
          ansible.builtin.copy:
            content: "PasswordAuthentication yes\n"
            dest: '/etc/ssh/sshd_config.d/10-molecule-precedence.conf'
            mode: '0644'
          register: ssh_precedence_fixture

        - name: Apply policy without reconciling foreign settings
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.ssh'

        - name: Query native precedence
          ansible.builtin.command:
            argv: ['sshd', '-T']
          changed_when: false
          register: ssh_precedence_effective

        - name: Inspect retained earlier policy
          ansible.builtin.stat:
            path: '/etc/ssh/sshd_config.d/10-molecule-precedence.conf'
          register: ssh_precedence_after

        - name: Assert native precedence and foreign-file preservation
          ansible.builtin.assert:
            that:
              - >-
                'passwordauthentication yes' in
                ssh_precedence_effective.stdout_lines
              - >-
                ssh_precedence_after.stat.checksum ==
                ssh_precedence_fixture.checksum
              - ssh_precedence_after.stat.uid == ssh_precedence_fixture.uid
              - ssh_precedence_after.stat.gid == ssh_precedence_fixture.gid
              - ssh_precedence_after.stat.mode == ssh_precedence_fixture.mode
      always:
        - name: Remove only the precedence fixture
          ansible.builtin.file:
            path: '/etc/ssh/sshd_config.d/10-molecule-precedence.conf'
            state: absent

    # Deployment validation cannot catch a foreign edit before handlers run.
    - name: Reject invalid policy introduced after restart was queued
      block:
        - name: Inspect service before delayed restart
          ansible.builtin.command:
            argv: ['systemctl', 'show', '--property=MainPID', '--value',
                   '{{ ssh_test_service }}']
          changed_when: false
          register: ssh_guard_pid_before

        - name: Queue a valid changed policy restart
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.ssh'
          vars:
            ssh_server_password_authentication: 'yes'

        - name: Introduce invalid policy before handler activation
          ansible.builtin.copy:
            content: "InvalidForeignDirective yes\n"
            dest: '/etc/ssh/sshd_config.d/10-molecule-invalid.conf'
            mode: '0644'

        - name: Require validation immediately before restart
          block:
            - name: Flush the delayed restart
              ansible.builtin.meta: flush_handlers

            - name: Fail if the invalid delayed restart was accepted
              ansible.builtin.fail:
                msg: 'Invalid delayed restart was accepted'
          rescue:
            - name: Assert the native delayed-restart diagnostic
              ansible.builtin.assert:
                that:
                  - >-
                    ansible_failed_result.stderr | default('') is
                    search('InvalidForeignDirective')

        - name: Inspect service after the rejected delayed restart
          ansible.builtin.command:
            argv: ['systemctl', 'show', '--property=MainPID', '--value',
                   '{{ ssh_test_service }}']
          changed_when: false
          register: ssh_guard_pid_after

        - name: Assert delayed invalid policy was not activated
          ansible.builtin.assert:
            that:
              - ssh_guard_pid_before.stdout | int > 0
              - ssh_guard_pid_before.stdout == ssh_guard_pid_after.stdout
      always:
        - name: Remove the intervening invalid fixture
          ansible.builtin.file:
            path: '/etc/ssh/sshd_config.d/10-molecule-invalid.conf'
            state: absent

        - name: Restore original validated policy
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.ssh'

        - name: Flush restored validated policy handlers
          ansible.builtin.meta: flush_handlers

    # Run these last so a later normal deployment cannot hide unintended writes.
    - name: Inspect service before non-mutating runs
      ansible.builtin.command:
        argv: ['systemctl', 'show', '--property=MainPID', '--value',
               '{{ ssh_test_service }}']
      changed_when: false
      register: ssh_noop_pid_before

    - name: Predict changed policy without deployment
      ansible.builtin.include_role:
        name: 'jaythomasonprojects.sys_admin.ssh'
        apply:
          check_mode: true
      vars:
        ssh_server_password_authentication: 'yes'

    - name: Skip disabled role management
      ansible.builtin.include_role:
        name: 'jaythomasonprojects.sys_admin.ssh'
      vars:
        ssh_enabled: false
        ssh_server_password_authentication: 'yes'

    - name: Flush any incorrectly queued non-mutating restart
      ansible.builtin.meta: flush_handlers

    - name: Inspect service after non-mutating runs
      ansible.builtin.command:
        argv: ['systemctl', 'show', '--property=MainPID', '--value',
               '{{ ssh_test_service }}']
      changed_when: false
      register: ssh_noop_pid_after

    # One baseline covers main, vendor, foreign files, and server identity.
    - name: Read the original foreign-file and host-key baseline
      ansible.builtin.slurp:
        src: '/var/tmp/ssh-preservation.json'
      register: ssh_preservation_baseline

    - name: Inspect all policy and identity files after the workflow
      ansible.builtin.stat:
        path: '{{ item.path }}'
        checksum_algorithm: 'sha256'
      loop: >-
        {{ (ssh_preservation_baseline.content | b64decode | from_json) +
           (ssh_owned_before.results | map(attribute='stat') | list) }}
      register: ssh_final_files

    - name: Assert all original contents and metadata remain intact
      ansible.builtin.assert:
        that:
          - item.stat.checksum == item.item.checksum
          - item.stat.uid == item.item.uid
          - item.stat.gid == item.item.gid
          - item.stat.mode == item.item.mode
      loop: '{{ ssh_final_files.results }}'

    - name: Find unexpected rollback state after non-mutating runs
      ansible.builtin.find:
        paths: '/etc/ssh/sshd_config.d'
        patterns: '99-sys-admin-sshd.conf.*'
      register: ssh_noop_backups

    - name: Gather final service state
      ansible.builtin.service_facts:

    # An empty baseline lets the preservation loop pass without testing keys.
    - name: Assert working service and host identity survived non-mutating runs
      ansible.builtin.assert:
        that:
          - >-
            (ssh_preservation_baseline.content | b64decode | from_json) |
            selectattr('path', 'search', '/ssh_host_') | list | length > 0
          - ssh_noop_pid_before.stdout | int > 0
          - ssh_noop_pid_before.stdout == ssh_noop_pid_after.stdout
          - ssh_noop_backups.matched == 0
          - >-
            ansible_facts.services[ssh_test_service ~ '.service'].state ==
            'running'
          - >-
            ansible_facts.services[ssh_test_service ~ '.service'].status ==
            'enabled'

---
- name: Verify SSH results
  hosts: all
  become: true
  gather_facts: false
  vars:
    expected_cloudinit_path: '/etc/ssh/sshd_config.d/50-cloud-init.conf'
    expected_client_config_path: '/etc/ssh/ssh_config.d/00-sys-admin-ssh.conf'
    expected_server_config_path: '/etc/ssh/sshd_config'
    expected_client_strict_host_key_checking: 'StrictHostKeyChecking no'
    expected_client_forward_agent: 'ForwardAgent no'
    expected_client_host_override: 'Host github.com'
    expected_client_override_user: 'User git'
    expected_server_permit_root_login: 'PermitRootLogin prohibit-password'
    expected_server_allow_users: 'AllowUsers molecule'
  tasks:
    - name: Gather minimal facts
      ansible.builtin.setup:
        gather_subset:
          - '!all'
          - 'min'

    - name: Check seeded cloud-init SSHD drop-in
      ansible.builtin.stat:
        path: "{{ expected_cloudinit_path }}"
      register: ssh_cloudinit_stat

    - name: Read rendered SSH client drop-in
      ansible.builtin.slurp:
        src: "{{ expected_client_config_path }}"
      register: ssh_client_config

    - name: Read complete SSH server configuration
      ansible.builtin.slurp:
        src: "{{ expected_server_config_path }}"
      register: ssh_server_config

    - name: Decode rendered SSH configs
      ansible.builtin.set_fact:
        ssh_client_content: >-
          {{ ssh_client_config.content | b64decode }}
        ssh_server_content: >-
          {{ ssh_server_config.content | b64decode }}

    - name: Assert role owns the complete server file
      ansible.builtin.assert:
        that:
          - expected_server_allow_users in ssh_server_content
          - "'Include /etc/ssh/sshd_config.d/' not in ssh_server_content"
          - >-
            ('Include /etc/crypto-policies/back-ends/opensshserver.config'
            in ssh_server_content)
            == (ansible_facts.distribution == 'Fedora')

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Set distribution-specific SSH expectations
      ansible.builtin.set_fact:
        expected_ssh_client_package: >-
          {{ 'openssh-clients' if ansible_facts.distribution == 'Fedora'
             else 'openssh-client' }}
        expected_ssh_server_package: 'openssh-server'
        expected_ssh_service: >-
          {{ 'sshd.service' if ansible_facts.distribution == 'Fedora'
             else 'ssh.service' }}

    - name: Query installed OpenSSH packages
      ansible.builtin.package_facts:
        manager: 'auto'

    - name: Validate final sshd configuration
      ansible.builtin.command:
        argv:
          - "sshd"
          - "-t"
      register: ssh_sshd_validation
      changed_when: false

    - name: Query effective server authentication settings
      ansible.builtin.command:
        argv:
          - 'sshd'
          - '-T'
          - '-C'
          - 'user=molecule,host=localhost,addr=127.0.0.1'
      register: ssh_effective_server
      changed_when: false

    - name: Assert important server authentication settings
      ansible.builtin.assert:
        that:
          - ssh_cloudinit_stat.stat.exists
          - >-
            ssh_effective_server.stdout_lines
            | select('match', '^passwordauthentication ') | first ==
            'passwordauthentication no'
          - >-
            ssh_effective_server.stdout_lines
            | select('match', '^permitrootlogin ') | first ==
            ('permitrootlogin without-password'
             if ansible_facts.distribution in ['Debian', 'Ubuntu']
             else 'permitrootlogin prohibit-password')

    - name: Query effective system SSH client policy
      ansible.builtin.command:
        argv:
          - 'ssh'
          - '-G'
          - '-F'
          - '/etc/ssh/ssh_config'
          - '{{ item }}'
      loop:
        - 'github.com'
        - 'other.invalid'
        - 'special.example.invalid'
        - 'generic.example.invalid'
      register: ssh_effective_client
      changed_when: false

    - name: Assert host overrides precede defaults in effective policy
      ansible.builtin.assert:
        that:
          - >-
            ssh_effective_client.results[0].stdout_lines
            | select('match', '^port ') | first == 'port 2222'
          - >-
            ssh_effective_client.results[0].stdout_lines
            | select('match', '^forwardagent ') | first == 'forwardagent yes'
          - >-
            ssh_effective_client.results[0].stdout_lines
            | select('match', '^connecttimeout ') | first ==
            'connecttimeout 60'
          - >-
            ssh_effective_client.results[1].stdout_lines
            | select('match', '^port ') | first == 'port 22'
          - >-
            ssh_effective_client.results[1].stdout_lines
            | select('match', '^forwardagent ') | first == 'forwardagent no'
          - >-
            ssh_effective_client.results[2].stdout_lines
            | select('match', '^port ') | first == 'port 2223'
          - >-
            ssh_effective_client.results[3].stdout_lines
            | select('match', '^port ') | first == 'port 2201'

    - name: Assert SSH configuration results
      ansible.builtin.assert:
        that:
          - ssh_cloudinit_stat.stat.exists
          - "ssh_sshd_validation.rc == 0"
          - 'expected_ssh_client_package in ansible_facts.packages'
          - 'expected_ssh_server_package in ansible_facts.packages'
          - 'expected_ssh_service in ansible_facts.services'
          - 'ansible_facts.services[expected_ssh_service].state == "running"'
          - 'ansible_facts.services[expected_ssh_service].status == "enabled"'
          - >-
            expected_client_strict_host_key_checking in
            ssh_client_content
          - "expected_client_forward_agent in ssh_client_content"
          - "expected_client_host_override in ssh_client_content"
          - "expected_client_override_user in ssh_client_content"
          - "expected_server_permit_root_login in ssh_server_content"
          - "expected_server_allow_users in ssh_server_content"
        fail_msg: >-
          ssh did not render the expected SSH state.
          cloudinit_exists={{ ssh_cloudinit_stat.stat.exists }}
          sshd_rc={{ ssh_sshd_validation.rc }}

- name: Reject invalid Linux SSH server policy before replacement
  hosts: all
  become: true
  gather_facts: true
  vars:
    ssh_service_name: >-
      {{ 'sshd' if ansible_facts.distribution == 'Fedora' else 'ssh' }}
  tasks:
    - name: Inspect working server file
      ansible.builtin.stat:
        path: '/etc/ssh/sshd_config'
        checksum_algorithm: 'sha256'
      register: ssh_rejection_before

    - name: Inspect running server process
      ansible.builtin.command:
        argv:
          - 'systemctl'
          - 'show'
          - '--property=MainPID'
          - '--value'
          - '{{ ssh_service_name }}'
      register: ssh_rejection_pid_before
      changed_when: false

    - name: Require native invalid candidate rejection
      block:
        - name: Apply invalid server grace period
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.ssh'
            tasks_from: 'linux/server.yml'
          vars:
            ssh_server_login_grace_time: 'invalid'

        - name: Fail if invalid candidate was accepted
          ansible.builtin.fail:
            msg: 'Invalid server candidate was accepted'
      rescue:
        - name: Assert native validator rejected the grace period
          ansible.builtin.assert:
            that:
              - ansible_failed_result.stderr is search('invalid time value')

    - name: Flush any incorrectly notified handler
      ansible.builtin.meta: flush_handlers

    - name: Inspect server file after rejection
      ansible.builtin.stat:
        path: '/etc/ssh/sshd_config'
        checksum_algorithm: 'sha256'
      register: ssh_rejection_after

    - name: Inspect server process after rejection
      ansible.builtin.command:
        argv:
          - 'systemctl'
          - 'show'
          - '--property=MainPID'
          - '--value'
          - '{{ ssh_service_name }}'
      register: ssh_rejection_pid_after
      changed_when: false

    - name: Assert rejection preserved working file and service
      ansible.builtin.assert:
        that:
          - >-
            ssh_rejection_before.stat.checksum ==
            ssh_rejection_after.stat.checksum
          - ssh_rejection_pid_before.stdout | int > 0
          - ssh_rejection_pid_before.stdout == ssh_rejection_pid_after.stdout

- name: Promote valid Linux server changes only once
  hosts: all
  become: true
  gather_facts: true
  vars:
    ssh_server_allow_users:
      - 'molecule'
    ssh_server_password_authentication: 'yes'
    ssh_server_permit_root_login: 'prohibit-password'
    ssh_service_name: >-
      {{ 'sshd' if ansible_facts.distribution == 'Fedora' else 'ssh' }}
  tasks:
    - name: Inspect original server configuration
      ansible.builtin.stat:
        path: '/etc/ssh/sshd_config'
        checksum_algorithm: 'sha256'
      register: ssh_transition_initial

    - name: Inspect original SSH service process
      ansible.builtin.command:
        argv:
          - 'systemctl'
          - 'show'
          - '--property=MainPID'
          - '--value'
          - '{{ ssh_service_name }}'
      register: ssh_transition_initial_pid
      changed_when: false

    - name: Exercise valid server transition and restore original policy
      block:
        - name: Apply valid changed server policy
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.ssh'
            tasks_from: 'linux/server.yml'

        - name: Flush changed server policy handlers
          ansible.builtin.meta: flush_handlers

        - name: Inspect activated server policy
          ansible.builtin.command:
            argv:
              - 'sshd'
              - '-T'
              - '-C'
              - 'user=molecule,host=localhost,addr=127.0.0.1'
          register: ssh_transition_effective
          changed_when: false

        - name: Inspect updated server configuration
          ansible.builtin.stat:
            path: '/etc/ssh/sshd_config'
            checksum_algorithm: 'sha256'
          register: ssh_transition_updated

        - name: Inspect restarted SSH service process
          ansible.builtin.command:
            argv:
              - 'systemctl'
              - 'show'
              - '--property=MainPID'
              - '--value'
              - '{{ ssh_service_name }}'
          register: ssh_transition_updated_pid
          changed_when: false

        - name: Assert the new policy was activated and restarted
          ansible.builtin.assert:
            that:
              - >-
                'passwordauthentication yes' in
                ssh_transition_effective.stdout_lines
              - >-
                ssh_transition_initial.stat.checksum !=
                ssh_transition_updated.stat.checksum
              - ssh_transition_initial_pid.stdout | int > 0
              - >-
                ssh_transition_initial_pid.stdout !=
                ssh_transition_updated_pid.stdout

        - name: Reapply unchanged server policy
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.ssh'
            tasks_from: 'linux/server.yml'

        - name: Flush unchanged server policy handlers
          ansible.builtin.meta: flush_handlers

        - name: Inspect service process after unchanged pass
          ansible.builtin.command:
            argv:
              - 'systemctl'
              - 'show'
              - '--property=MainPID'
              - '--value'
              - '{{ ssh_service_name }}'
          register: ssh_transition_repeat_pid
          changed_when: false

        - name: Assert repeat run did not restart SSH
          ansible.builtin.assert:
            that:
              - >-
                ssh_transition_repeat_pid.stdout ==
                ssh_transition_updated_pid.stdout
      always:
        - name: Restore original server policy
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.ssh'
            tasks_from: 'linux/server.yml'
          vars:
            ssh_server_password_authentication: 'no'

        - name: Flush restored server policy handlers
          ansible.builtin.meta: flush_handlers

---
driver:
  name: 'molecule-proxmox'
  options:
    ssh_identity_file: '${MOLECULE_LINUX_IDENTITY_FILE}'
    ssh_port: '${MOLECULE_LINUX_SSH_PORT}'
    ssh_user: '${MOLECULE_LINUX_USER}'

platforms:
  - name: 'ubuntu2404'
    newid: '${MOLECULE_UBUNTU2404_VMID:-required-vmid}'
    template_vmid: >-
      ${MOLECULE_UBUNTU2404_TEMPLATE_VMID:-required-template-vmid}
  - name: 'ubuntu2604'
    newid: '${MOLECULE_UBUNTU2604_VMID:-required-vmid}'
    template_vmid: >-
      ${MOLECULE_UBUNTU2604_TEMPLATE_VMID:-required-template-vmid}

provisioner:
  name: 'ansible'
  inventory:
    group_vars:
      all:
        ansible_remote_tmp: '/tmp/ansible-{{ ansible_user | default("root") }}'
        ssh_client_forward_agent: 'no'
        ssh_client_host_overrides:
          - host: 'github.com'
            settings:
              ConnectTimeout: '1m'
              ForwardAgent: 'yes'
              Port: 2222
              User: 'git'
          - host: 'special.example.invalid'
            settings:
              Port: 2223
          - host: '*.example.invalid'
            settings:
              Port: 2201
        ssh_client_strict_host_key_checking: 'no'
        ssh_server_allow_users:
          - 'molecule'
        ssh_server_client_alive_count_max: 2
        ssh_server_client_alive_interval: 30
        ssh_server_password_authentication: 'no'
        ssh_server_permit_root_login: 'prohibit-password'
        ssh_server_port: '${MOLECULE_LINUX_SSH_PORT}'

scenario:
  name: 'ssh/linux'

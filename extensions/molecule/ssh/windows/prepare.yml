---
- name: Prepare account-key fixtures over the clone's installed SSH
  hosts: all
  gather_facts: false
  vars:
    ansible_port: >-
      {{ lookup('ansible.builtin.env', 'MOLECULE_WINDOWS_SSH_PORT') | int }}
  tasks:
    - name: Require the identified disposable SSH scenario connection
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'ssh-windows'
          - ansible_host | length > 0
          - ansible_user | lower not in ['sa_key_admin', 'sa_key_standard']

    - name: Wait for key-authenticated clone access
      ansible.builtin.wait_for_connection:
        timeout: 600

    - name: Verify Windows module execution over key-only SSH
      ansible.windows.win_ping:

    - name: Gather Windows facts for the disabled pass
      ansible.builtin.setup:

    - name: Apply disabled SSH policy without changing prepared access
      ansible.builtin.include_role:
        name: 'jaythomasonprojects.sys_admin.ssh'
      vars:
        ssh_enabled: false

    - name: Create the controller fixture-key directory
      ansible.builtin.file:
        mode: '0700'
        path: '{{ ssh_fixture_keys }}'
        state: directory
      delegate_to: localhost
      vars:
        ansible_connection: 'local'
        ansible_shell_type: 'sh'

    - name: Generate distinct disposable login keys
      ansible.builtin.command:
        argv:
          - 'ssh-keygen'
          - '-q'
          - '-t'
          - 'ed25519'
          - '-N'
          - ''
          - '-f'
          - '{{ ssh_fixture_keys }}/{{ item }}'
        creates: '{{ ssh_fixture_keys }}/{{ item }}'
      delegate_to: localhost
      vars:
        ansible_connection: 'local'
        ansible_shell_type: 'sh'
      loop:
        - 'admin'
        - 'standard'
        - 'shared'

    - name: Create the administrative key fixture with native account policy
      ansible.windows.win_user:
        groups:
          - 'S-1-5-32-544'
        name: 'sa_key_admin'
        password: 'Synthetic-Key-Fixture!2026'
        state: present
      no_log: true

    - name: Create the standard key fixture with native account policy
      ansible.windows.win_user:
        name: 'sa_key_standard'
        password: 'Synthetic-Key-Fixture!2026'
        state: present
      register: ssh_fixture_standard
      no_log: true

    - name: Create a native profile with a different directory name
      ansible.windows.win_user_profile:
        name: 'sa_key_alternate'
        username: '{{ ssh_fixture_standard.sid }}'
        state: present

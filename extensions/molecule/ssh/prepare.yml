---
- name: Prepare SSH scenario
  hosts: all
  gather_facts: false
  tasks:
    - name: Gather minimal facts
      ansible.builtin.setup:
        gather_subset:
          - "!all"
          - "min"

    - name: Remove OpenSSH packages
      ansible.builtin.apt:
        name:
          - 'openssh-client'
          - 'openssh-server'
        state: absent
        update_cache: true
      when: ansible_facts.distribution in ['Debian', 'Ubuntu']

    - name: Install Fedora OpenSSH server for host-key fixture
      ansible.builtin.dnf:
        name: 'openssh-server'
        state: present
      when: ansible_facts.distribution == 'Fedora'

    - name: Create Fedora SSH host-key fixture
      ansible.builtin.command:
        argv:
          - 'ssh-keygen'
          - '-A'
      changed_when: false
      when: ansible_facts.distribution == 'Fedora'

    - name: Remove Fedora OpenSSH packages
      ansible.builtin.dnf:
        name:
          - 'openssh-clients'
          - 'openssh-server'
        state: absent
      when: ansible_facts.distribution == 'Fedora'

    - name: Create SSH drop-in directories
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        mode: '0755'
      loop:
        - '/etc/ssh/ssh_config.d'
        - '/etc/ssh/sshd_config.d'

    - name: Create SSHD runtime directory
      ansible.builtin.file:
        path: '/run/sshd'
        state: directory
        mode: '0755'

    - name: Seed cloud-init SSHD drop-in
      ansible.builtin.copy:
        dest: '/etc/ssh/sshd_config.d/50-cloud-init.conf'
        content: |
          PasswordAuthentication yes
          PermitRootLogin yes
        mode: '0644'

    - name: Seed legacy SSH drop-ins
      ansible.builtin.copy:
        dest: '{{ item }}'
        content: '# Legacy SSH configuration\n'
        mode: '0644'
      loop:
        - '/etc/ssh/ssh_config.d/99-custom.conf'
        - '/etc/ssh/sshd_config.d/99-custom.conf'

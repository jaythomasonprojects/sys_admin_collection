---
# Shared Molecule defaults for this collection.
#
# Role/platform scenarios load this project-level config.
# Keep per-scenario molecule.yml files focused on the driver and guest
# runtime they need, and centralise the common execution flow here.
dependency:
  name: "galaxy"
  options:
    requirements-file: '${MOLECULE_PROJECT_DIRECTORY}/requirements.yml'

provisioner:
  name: "ansible"
  env:
    ANSIBLE_COLLECTIONS_PATH: >-
      ${MOLECULE_PROJECT_DIRECTORY}/.ansible/collections

scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy

shared_state: false

verifier:
  name: "ansible"

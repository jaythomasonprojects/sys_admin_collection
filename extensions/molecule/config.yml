---
prerun: false

dependency:
  name: 'galaxy'
  options:
    requirements-file: '${MOLECULE_PROJECT_DIRECTORY}/requirements.yml'

driver:
  name: 'molecule-proxmox'
  options:
    api_timeout: 60
    full: false
    node: '${MOLECULE_PROXMOX_NODE}'
    pool: '${MOLECULE_PROXMOX_POOL}'
    proxmox_secrets: >-
      ${MOLECULE_PROJECT_DIRECTORY}/.config/molecule/proxmox.yml
    sethostname: false
    ssh_host_public_key_path: '/etc/ssh/ssh_host_ed25519_key.pub'
    ssh_identity_file: '${MOLECULE_LINUX_IDENTITY_FILE}'
    ssh_port: '${MOLECULE_LINUX_SSH_PORT}'
    ssh_user: '${MOLECULE_LINUX_USER}'
    storage: '${MOLECULE_PROXMOX_STORAGE}'
    timeout: 1200
    validate_certs: true
  ssh_connection_options:
    - '-o StrictHostKeyChecking=yes'
    - '-o UserKnownHostsFile=${MOLECULE_EPHEMERAL_DIRECTORY}/known_hosts'
    - '-o IdentitiesOnly=yes'

provisioner:
  name: 'ansible'
  inventory:
    host_vars:
      ubuntu2604:
        # sudo-rs custom prompts are incompatible with this controller line.
        ansible_become_exe: '/usr/bin/sudo.ws'
  playbooks:
    create: '${MOLECULE_PROJECT_DIRECTORY}/extensions/molecule/create.yml'
    destroy: '${MOLECULE_PROJECT_DIRECTORY}/extensions/molecule/destroy.yml'
  env:
    ANSIBLE_COLLECTIONS_PATH: '${ANSIBLE_COLLECTIONS_PATH}'
    ANSIBLE_COLLECTIONS_SCAN_SYS_PATH: 'false'
    MOLECULE_LINUX_IDENTITY_FILE: '${MOLECULE_LINUX_IDENTITY_FILE}'
    MOLECULE_WINDOWS_SSH_PORT: '${MOLECULE_WINDOWS_SSH_PORT}'
    MOLECULE_WINDOWS_USER: '${MOLECULE_WINDOWS_USER}'
    REQUESTS_CA_BUNDLE: '${REQUESTS_CA_BUNDLE}'

scenario:
  # Identity and DHCP must be verified before fixture preparation.
  create_sequence:
    - dependency
    - create
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy

shared_state: false

verifier:
  name: 'ansible'

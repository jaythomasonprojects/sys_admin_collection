---
- name: Verify mount_network_share results
  hosts: all
  become: true
  gather_facts: false
  vars:
    expected_workstation_mount: '/mnt/workstation-data'
    expected_shared_mount: '/srv/shared-docs'
    expected_absent_mount: '/mnt/old-share'
    expected_workstation_credentials: '/home/molecule/.smbcredentials'
    expected_shared_credentials: '/etc/samba/credentials/shared_docs'
    expected_absent_credentials: '/home/molecule/.smbcredentials-old-share'
    expected_workstation_share: '//files.example.invalid/Data'
    expected_shared_share: '//nas.example.invalid/Docs'
    expected_absent_share: '//legacy.example.invalid/OldShare'
    expected_workstation_credentials_option: >-
      credentials=/home/molecule/.smbcredentials
    expected_shared_credentials_option: >-
      credentials=/etc/samba/credentials/shared_docs
  tasks:
    - name: Define Windows mapped-drive rendering inputs
      ansible.builtin.set_fact:
        mount_network_share_expected_windows_path: >-
          \\files.example.invalid\Data
        mount_network_share_item:
          mount_point: 'Z'
          password: 'test-password'
          server: 'files.example.invalid'
          share: 'Data'
          username: 'test-user'
        windows_share_name: 'Data'
        windows_share_server: 'files.example.invalid'

    - name: Load Windows mapped-drive task definition
      ansible.builtin.set_fact:
        mount_network_share_expected_become_pass: >-
          {{ '{{ mount_network_share_item.password | default("") }}' }}
        mount_network_share_expected_become_user: >-
          {{ '{{ mount_network_share_item.username | default("") }}' }}
        mount_network_share_expected_credential_name: >-
          {{ '{{ mount_network_share_item.server }}' }}
        mount_network_share_expected_credential_secret: >-
          {{ '{{ mount_network_share_item.password }}' }}
        mount_network_share_expected_credential_username: >-
          {{ '{{ mount_network_share_item.username }}' }}
        mount_network_share_windows_tasks: >-
          {{ lookup(
               'ansible.builtin.file',
               playbook_dir
               ~ '/../../../roles/mount_network_share/tasks/win_share.yml'
             ) | from_yaml }}
        mount_network_share_rendered_windows_tasks: >-
          {{ lookup(
               'ansible.builtin.template',
               playbook_dir
               ~ '/../../../roles/mount_network_share/tasks/win_share.yml'
             ) | from_yaml }}

    - name: Assert Windows task count
      ansible.builtin.assert:
        that:
          - mount_network_share_windows_tasks | length == 2
        fail_msg: >-
          Windows credentialed shares must persist a credential before mapping
          the drive.

    - name: Render Windows mapped-drive path
      ansible.builtin.set_fact:
        mount_network_share_rendered_windows_path: >-
          {{ mount_network_share_rendered_windows_tasks[1]
             ['ansible.windows.win_mapped_drive'].path }}

    - name: Render Windows mapped-drive letter
      ansible.builtin.set_fact:
        mount_network_share_rendered_windows_letter: >-
          {{ mount_network_share_rendered_windows_tasks[1]
             ['ansible.windows.win_mapped_drive'].letter }}

    - name: Assert Windows mapped-drive credential persistence
      ansible.builtin.assert:
        that:
          - >-
            mount_network_share_rendered_windows_path
            == mount_network_share_expected_windows_path
          - mount_network_share_rendered_windows_letter == 'Z'
          - mount_network_share_windows_tasks[0].become_user is not defined
          - >-
            mount_network_share_windows_tasks[0]
            ['ansible.windows.win_credential'].name
            == mount_network_share_expected_credential_name
          - >-
            mount_network_share_windows_tasks[0]
            ['ansible.windows.win_credential'].type == 'domain_password'
          - >-
            mount_network_share_windows_tasks[0]
            ['ansible.windows.win_credential'].username
            == mount_network_share_expected_credential_username
          - >-
            mount_network_share_windows_tasks[0]
            ['ansible.windows.win_credential'].secret
            == mount_network_share_expected_credential_secret
          - >-
            mount_network_share_windows_tasks[0]
            ['ansible.windows.win_credential'].persistence == 'local'
          - >-
            mount_network_share_windows_tasks[0]
            ['ansible.windows.win_credential'].state == 'present'
          - >-
            mount_network_share_windows_tasks[0].when
            == 'mount_network_share_item.username is defined'
          - mount_network_share_windows_tasks[1].become_user is not defined
          - >-
            mount_network_share_windows_tasks[1]
            ['ansible.windows.win_mapped_drive'].username is not defined
          - >-
            mount_network_share_windows_tasks[1]
            ['ansible.windows.win_mapped_drive'].password is not defined
          - mount_network_share_windows_tasks[0].become is defined
          - mount_network_share_windows_tasks[1].become is defined
          - >-
            mount_network_share_windows_tasks[0].become_method
            == 'ansible.builtin.runas'
          - >-
            mount_network_share_windows_tasks[0].become_flags
            == 'logon_type=interactive logon_flags=with_profile'
          - >-
            mount_network_share_windows_tasks[0]
            .get('vars', {}).get('ansible_become_user')
            == mount_network_share_expected_credential_username
          - >-
            mount_network_share_windows_tasks[0]
            .get('vars', {}).get('ansible_become_pass')
            == mount_network_share_expected_credential_secret
          - >-
            mount_network_share_windows_tasks[1].become_method
            == 'ansible.builtin.runas'
          - >-
            mount_network_share_windows_tasks[1].become_flags
            == 'logon_type=interactive logon_flags=with_profile'
          - >-
            mount_network_share_windows_tasks[1]
            .get('vars', {}).get('ansible_become_user')
            == mount_network_share_expected_become_user
          - >-
            mount_network_share_windows_tasks[1]
            .get('vars', {}).get('ansible_become_pass')
            == mount_network_share_expected_become_pass
        fail_msg: >-
          Windows credentialed shares must persist a per-server credential and
          map drives through that user's Credential Manager.

    - name: Gather mount point state
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ expected_workstation_mount }}"
        - "{{ expected_shared_mount }}"
        - "{{ expected_absent_mount }}"
      register: mount_network_share_mount_points

    - name: Gather credential file state
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ expected_workstation_credentials }}"
        - "{{ expected_shared_credentials }}"
        - "{{ expected_absent_credentials }}"
      register: mount_network_share_credentials
      no_log: true

    - name: Gather molecule home directory state
      ansible.builtin.stat:
        path: '/home/molecule'
      register: mount_network_share_molecule_home

    - name: Read fstab
      ansible.builtin.slurp:
        src: '/etc/fstab'
      register: mount_network_share_fstab

    - name: Read workstation credentials
      ansible.builtin.slurp:
        src: "{{ expected_workstation_credentials }}"
      register: mount_network_share_workstation_credentials
      no_log: true

    - name: Read shared credentials
      ansible.builtin.slurp:
        src: "{{ expected_shared_credentials }}"
      register: mount_network_share_shared_credentials
      no_log: true

    - name: Decode fstab and credentials
      ansible.builtin.set_fact:
        mns_mounts: "{{ mount_network_share_mount_points.results }}"
        mns_creds: "{{ mount_network_share_credentials.results }}"
        mns_fstab: >-
          {{ mount_network_share_fstab.content | b64decode }}
        mns_workstation_creds: >-
          {{ mount_network_share_workstation_credentials.content | b64decode }}
        mns_shared_creds: >-
          {{ mount_network_share_shared_credentials.content | b64decode }}
      no_log: true

    - name: Assert mount_network_share state
      ansible.builtin.assert:
        that:
          - "mns_mounts[0].stat.isdir"
          - "mns_mounts[0].stat.pw_name == 'molecule'"
          - "mns_mounts[0].stat.gr_name == 'molecule'"
          - "mns_mounts[0].stat.mode == '0750'"
          - "mns_mounts[1].stat.isdir"
          - "mns_mounts[1].stat.pw_name == 'root'"
          - "mns_mounts[1].stat.gr_name == 'root'"
          - "mns_mounts[1].stat.mode == '0755'"
          - "not mns_mounts[2].stat.exists"
          - "mns_creds[0].stat.mode == '0600'"
          - "mns_creds[0].stat.pw_name == 'molecule'"
          - "mns_creds[1].stat.mode == '0600'"
          - "mns_creds[1].stat.pw_name == 'root'"
          - "not mns_creds[2].stat.exists"
          - "mount_network_share_molecule_home.stat.mode != '0700'"
          - "'username=molecule' in mns_workstation_creds"
          - "'password=molecule-password' in mns_workstation_creds"
          - "'username=svc_docs' in mns_shared_creds"
          - "'password=svc-docs-password' in mns_shared_creds"
          - "expected_workstation_share in mns_fstab"
          - "expected_workstation_mount in mns_fstab"
          - "expected_workstation_credentials_option in mns_fstab"
          - "expected_shared_share in mns_fstab"
          - "expected_shared_mount in mns_fstab"
          - "expected_shared_credentials_option in mns_fstab"
          - "expected_absent_share not in mns_fstab"
          - "expected_absent_mount not in mns_fstab"
        fail_msg: >-
          mount_network_share did not create the expected fstab state.
      no_log: true

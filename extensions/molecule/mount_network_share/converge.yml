---
- name: Converge mount_network_share scenario
  hosts: all
  become: true
  gather_facts: true
  vars:
    mount_network_share_reload_remote_fs: false
    mount_network_share_shares:
      - name: "workstation_data"
        server: "files.example.invalid"
        share: "Data"
        mount_point: "/mnt/workstation-data"
        owner: "molecule"
        group: "molecule"
        mode: "0750"
        fstab_options:
          - "_netdev"
          - "nofail"
          - "ro"
        credentials_path: "/home/molecule/.smbcredentials"
        credentials_owner: "molecule"
        credentials_group: "molecule"
        username: "molecule"
        password: "molecule-password"
      - name: "shared_docs"
        server: "nas.example.invalid"
        share: "Docs"
        mount_point: "/srv/shared-docs"
        fstab_options:
          - '_netdev'
          - 'nofail'
          - 'vers=3.0'
        credentials_path: "/etc/samba/credentials/shared_docs"
        username: "svc_docs"
        password: "svc-docs-password"
      - name: "explicit_local_ids"
        server: "nas.example.invalid"
        share: "ExplicitIds"
        mount_point: "/mnt/explicit-local-ids"
        fstab_options:
          - "_netdev"
          - "nofail"
          - "uid=1001"
          - "gid=1002"
      - name: "old_share"
        server: "legacy.example.invalid"
        share: "OldShare"
        mount_point: "/mnt/old-share"
        state: "absent"
        credentials_path: "/home/molecule/.smbcredentials-old-share"
        username: "legacy_user"
        password: "legacy-password"
  pre_tasks:
    - name: Ensure molecule group exists
      ansible.builtin.group:
        name: "molecule"
        gid: 1000
        state: present

    - name: Ensure molecule user exists
      ansible.builtin.user:
        name: "molecule"
        uid: 1000
        group: "molecule"
        create_home: true
        state: present
  roles:
    - role: "jaythomasonprojects.sys_admin.mount_network_share"
  tasks:
    - name: Reject incomplete disabled share definitions
      block:
        - name: Include disabled role with an incomplete share
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.mount_network_share'
          vars:
            mount_network_share_enabled: false
            mount_network_share_shares:
              - name: 'invalid_share'
                server: 'files.example.invalid'
                share: 'Invalid'

        - name: Fail when incomplete disabled share is accepted
          ansible.builtin.fail:
            msg: 'mount_network_share accepted an incomplete disabled share.'
      rescue:
        - name: Assert required mount point rejection
          ansible.builtin.assert:
            that:
              - "'missing required arguments' in ansible_failed_result.msg"
              - "'mount_point' in ansible_failed_result.msg"

    - name: Reject comma-separated mount options
      block:
        - name: Include role with comma-separated mount options
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.mount_network_share'
          vars:
            mount_network_share_shares:
              - name: 'invalid_options'
                server: 'files.example.invalid'
                share: 'Invalid'
                mount_point: '/mnt/invalid-options'
                fstab_options: '_netdev,nofail'

        - name: Fail when comma-separated mount options are accepted
          ansible.builtin.fail:
            msg: 'mount_network_share accepted comma-separated fstab_options.'
      rescue:
        - name: Assert mount option rejection
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_result.results
                | map(attribute='msg')
                | list
                == [
                  'mount_network_share fstab_options must be a YAML list '
                  ~ 'of strings.'
                ]

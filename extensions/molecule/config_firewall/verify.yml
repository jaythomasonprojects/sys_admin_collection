---
- name: Verify config_firewall skips on Linux
  hosts: all
  gather_facts: true
  tasks:
    - name: Gather installed package facts
      ansible.builtin.package_facts:

    - name: Assert no firewall packages were installed
      ansible.builtin.assert:
        that:
          - "'ufw' not in ansible_facts.packages"
        fail_msg: >-
          config_firewall must skip on Linux hosts. It should not
          have installed any packages.

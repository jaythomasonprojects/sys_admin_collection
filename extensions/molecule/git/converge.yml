---
- name: Converge git scenario
  hosts: all
  become: true
  gather_facts: true
  environment:
    HOME: '/root'
  vars:
    git_user_name: 'Molecule User'
    git_user_email: 'molecule@example.invalid'
  roles:
    - role: 'jaythomasonprojects.sys_admin.git'
  tasks:
    - name: Reject unsupported operating systems
      block:
        - name: Configure unsupported operating system
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.git'
          vars:
            ansible_facts:
              system: 'Darwin'
      rescue:
        - name: Record unsupported operating system rejection
          ansible.builtin.set_fact:
            git_unsupported_platform_failure: >-
              {{ ansible_failed_result.msg | default('') }}

    - name: Assert unsupported operating system was rejected
      ansible.builtin.assert:
        that:
          - >-
            git_unsupported_platform_failure ==
             'git supports Linux hosts only.'

    - name: Reject unsupported Linux distributions
      block:
        - name: Configure unsupported Linux distribution
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.git'
          vars:
            ansible_facts:
              distribution: 'Fedora'
              system: 'Linux'
      rescue:
        - name: Record unsupported Linux distribution rejection
          ansible.builtin.set_fact:
            git_unsupported_distribution_failure: >-
              {{ ansible_failed_result.msg | default('') }}

    - name: Assert unsupported Linux distribution was rejected
      ansible.builtin.assert:
        that:
          - >-
            git_unsupported_distribution_failure ==
             'git supports Debian and Ubuntu hosts only.'

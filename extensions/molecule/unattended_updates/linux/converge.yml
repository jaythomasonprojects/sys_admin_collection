---
- name: Converge unattended_updates scenario
  hosts: all
  become: true
  gather_facts: true
  vars:
    unattended_updates_enabled: true
    unattended_updates_apt_origins:
      - 'origin=Ubuntu,codename=${distro_codename},label=Ubuntu'
    unattended_updates_apt_package_blacklist:
      - "curl"
    unattended_updates_apt_auto_reboot: true
    unattended_updates_apt_auto_reboot_time: "03:00"
  roles:
    - role: "jaythomasonprojects.sys_admin.unattended_updates"

  tasks:
    - name: Reject Ubuntu 22.04 before update policy mutation
      block:
        - name: Apply update policy with unsupported Ubuntu release facts
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.unattended_updates'
          vars:
            ansible_facts:
              distribution: 'Ubuntu'
              distribution_version: '22.04'
              os_family: 'Debian'
              system: 'Linux'

        - name: Fail if Ubuntu 22.04 was accepted
          ansible.builtin.fail:
            msg: 'Unsupported Ubuntu release was accepted'
      rescue:
        - name: Require the release-gate diagnostic
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_result.msg ==
                'unattended_updates supports Ubuntu 24.04/26.04 and Windows '
                ~ 'hosts only.'

    - name: Initialise unsupported operating system rejection result
      ansible.builtin.set_fact:
        unattended_updates_unsupported_os_rejected: false

    - name: Assert unsupported operating systems are rejected
      block:
        - name: Apply update policy with unsupported operating system facts
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.unattended_updates'
          vars:
            ansible_facts:
              os_family: 'Darwin'
              pkg_mgr: 'homebrew'
              system: 'Darwin'
      rescue:
        - name: Assert unsupported operating system failed
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_result.msg ==
                'unattended_updates supports Ubuntu 24.04/26.04 and Windows '
                ~ 'hosts only.'
        - name: Record unsupported operating system rejection
          ansible.builtin.set_fact:
            unattended_updates_unsupported_os_rejected: true

    - name: Confirm unsupported operating system was rejected
      ansible.builtin.assert:
        that:
          - unattended_updates_unsupported_os_rejected

    - name: Initialise excluded distribution rejection result
      ansible.builtin.set_fact:
        unattended_updates_unsupported_package_manager_rejected: false

    - name: Assert excluded Linux distributions are rejected
      block:
        - name: Include unattended_updates with excluded distribution facts
          ansible.builtin.include_role:
            name: 'jaythomasonprojects.sys_admin.unattended_updates'
          vars:
            ansible_facts:
              distribution: 'Debian'
              os_family: 'Debian'
              pkg_mgr: 'zypper'
              system: 'Linux'
      rescue:
        - name: Assert unsupported package manager failed
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_result.msg ==
                'unattended_updates supports Ubuntu 24.04/26.04 and Windows '
                ~ 'hosts only.'
        - name: Record unsupported package manager rejection
          ansible.builtin.set_fact:
            unattended_updates_unsupported_package_manager_rejected: true

    - name: Confirm unsupported package manager was rejected
      ansible.builtin.assert:
        that:
          - unattended_updates_unsupported_package_manager_rejected

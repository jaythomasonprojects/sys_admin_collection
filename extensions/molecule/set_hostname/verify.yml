---
- name: Verify set_hostname skips on Linux
  hosts: all
  gather_facts: true
  tasks:
    - name: Assert hostname was not changed
      ansible.builtin.assert:
        that:
          - ansible_facts.hostname != 'molecule-test-host'
        fail_msg: >-
          set_hostname must skip on Linux hosts. The hostname should
          not have been changed to molecule-test-host.
